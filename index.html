<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#031512">
<title>عمار الأسطورة 👑</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  color:#f4fffc;
  background:radial-gradient(circle at 50% -10%,#08775e,#06372d 38%,#02120f);
}

button{
  font-family:inherit;
  -webkit-user-select:none;
  user-select:none;
}

.app{
  height:100dvh;
  max-width:760px;
  margin:auto;
  padding:5px 7px;
  display:flex;
  flex-direction:column;
  gap:5px;
  overflow:hidden;
}

.top{
  height:52px;
  display:grid;
  grid-template-columns:52px 1fr 52px 52px 52px;
  gap:5px;
  align-items:center;
  flex:none;
}

.logo{
  text-align:center;
  font-size:clamp(19px,5vw,30px);
  font-weight:900;
  background:linear-gradient(90deg,#58e9a9,#68edf0);
  -webkit-background-clip:text;
  color:transparent;
  white-space:nowrap;
}

.scircle{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#07372f;
  border:2px solid #1b7662;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:10px;
  color:#fff;
}

.scircle b{
  color:#ffd84f;
  font-size:16px;
}

.sound{
  font-size:21px;
  background:#07372f;
  color:#fff;
}

.progress{
  height:43px;
  flex:none;
  border:1px solid #1c6555;
  border-radius:25px;
  background:#062b24;
  display:grid;
  grid-template-columns:1fr 1.5fr 1fr;
  align-items:center;
  padding:5px 11px;
  gap:7px;
  font-size:12px;
  font-weight:900;
}

.barbox{
  height:9px;
  background:#12483e;
  border-radius:20px;
  overflow:hidden;
}

#bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#5fe2a0,#5be8ef);
  transition:.25s;
}

.main{
  min-height:0;
  flex:1;
  border:2px solid #15745e;
  border-radius:25px;
  background:#041f1af5;
  padding:7px;
  display:flex;
  flex-direction:column;
  gap:5px;
  overflow:hidden;
}

.cat{
  height:20px;
  text-align:center;
  color:#55e6ac;
  font-weight:900;
  font-size:13px;
}

.question{
  height:76px;
  width:100%;
  flex:none;
  border:1px solid #1a6353;
  border-radius:18px;
  background:#031b17;
  color:#f4fffc;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:5px;
  outline:none;
  cursor:default;
}

#q{
  font-size:clamp(17px,4.5vw,25px);
  font-weight:900;
  line-height:1.3;
}

.answers{
  min-height:0;
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:6px;
}

.answer{
  min-height:0;
  width:100%;
  border-radius:17px;
  background:#062c25;
  border:1.5px solid #176252;
  color:#fff;
  font-size:clamp(13px,3.7vw,19px);
  font-weight:900;
  padding:5px;
  outline:none;
  transition:.12s;
}

.answer:active{
  transform:scale(.97);
}

.answer.correct{
  background:#075b42;
  border-color:#69ff9a;
  box-shadow:0 0 16px #4cff8a55;
}

.answer.wrong{
  background:#632c35;
  border-color:#ff777f;
}

.answer:disabled{
  opacity:.9;
}

.option-inner{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}

.option-number{
  width:32px;
  height:32px;
  min-width:32px;
  border-radius:50%;
  background:#0b493d;
  border:1px solid #2b806b;
  color:#ffd84f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
}

.option-text{
  flex:1;
  text-align:center;
  overflow-wrap:anywhere;
  line-height:1.25;
}

.tools{
  height:103px;
  flex:none;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:1fr 1fr;
  gap:4px;
}

.tool{
  border-radius:50%;
  background:#062d26;
  border:1.5px solid #176a58;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:19px;
  padding:2px;
}

.tool small{
  font-size:9px;
  font-weight:900;
  white-space:nowrap;
}

.tool:disabled{
  opacity:.32;
}

.stats{
  height:40px;
  flex:none;
  border:1px solid #1b6354;
  border-radius:22px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  align-items:center;
  background:#052820;
}

.stats div{
  text-align:center;
  font-size:10px;
}

.stats b{
  display:block;
  color:#ffd84f;
  font-size:15px;
  line-height:15px;
}

.toast{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:8px;
  transform:translate(-50%,20px);
  opacity:0;
  background:#062b24;
  border:1px solid #3c9c81;
  border-radius:13px;
  padding:7px 13px;
  font-weight:900;
  font-size:12px;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:none;
  align-items:center;
  justify-content:center;
  padding:10px;
  z-index:50;
}

.modal.show{
  display:flex;
}

.box{
  width:min(560px,100%);
  max-height:88dvh;
  overflow:auto;
  background:#062820;
  border:1px solid #2a7c67;
  border-radius:20px;
  padding:13px;
}

.box h2{
  margin:0 0 9px;
  color:#61e9e2;
  font-size:20px;
}

.close{
  float:left;
  background:#173e35;
  border:0;
  color:#fff;
  border-radius:9px;
  padding:3px 8px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.mb{
  background:#0a382f;
  color:#fff;
  border:1px solid #1c6654;
  border-radius:12px;
  padding:9px;
  font-weight:bold;
}

.active{
  border-color:#67efa8!important;
  background:#0b4c3c!important;
}

.list{
  display:grid;
  gap:5px;
}

.row{
  display:flex;
  justify-content:space-between;
  background:#0a342c;
  border:1px solid #195a4c;
  border-radius:11px;
  padding:8px;
  font-size:12px;
}

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:
