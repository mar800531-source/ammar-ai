<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>عمار الأسطورة 👑</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:
    radial-gradient(circle at 50% -10%,#08765d,#03251f 55%,#011512);
  color:#fff;
  overflow-x:hidden;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
  color:#fff;
}

.app{
  width:min(700px,100%);
  margin:auto;
  padding:10px;
}

/* ================= HEADER ================= */

.header{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  align-items:center;
  gap:6px;
  margin-bottom:10px;
}

.logo{
  grid-column:2/5;
  text-align:center;
  font-size:clamp(25px,7vw,42px);
  font-weight:900;
  line-height:1.05;

  background:linear-gradient(90deg,#4ff0a5,#70f3df,#b2ff67);
  -webkit-background-clip:text;
  color:transparent;
}

.logo span{
  display:block;
  font-size:25px;
}

.circleStat{
  width:68px;
  height:68px;
  margin:auto;

  border-radius:50%;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  background:#062b24;
  border:2px solid #16785f;

  box-shadow:
    inset 0 0 20px #00c88b14,
    0 0 12px #00d8a033;
}

.circleStat b{
  font-size:25px;
  color:#ffd83d;
}

.circleStat small{
  font-size:12px;
  color:#d9eee9;
}

/* ================= PROGRESS ================= */

.progress{
  border:2px solid #125b4d;
  border-radius:30px;
  padding:10px 14px;
  background:#062a24;
  margin-bottom:10px;
}

.progressTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
  font-size:16px;
}

.progressBar{
  height:9px;
  margin-top:8px;
  background:#103f37;
  border-radius:20px;
  overflow:hidden;
}

.progressBar span{
  display:block;
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#55df95,#a1ff65);
  transition:.4s;
}

/* ================= GAME PANEL ================= */

.game{
  border:2px solid #17775f;
  border-radius:34px;
  background:
    linear-gradient(145deg,#052c25e8,#021d19e8);
  padding:15px;
  box-shadow:0 0 30px #00c89012;
}

.category{
  text-align:center;
  color:#55e5a3;
  font-size:21px;
  font-weight:900;
  margin:5px 0 12px;
}

.question{
  min-height:125px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:12px;
}

.questionText{
  font-size:clamp(25px,6vw,38px);
  font-weight:900;
  line-height:1.45;
}

/* ================= ANSWERS ================= */

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  max-width:550px;
  margin:5px auto 12px;
  padding:5px;
}

.answer{
  min-height:82px;

  border-radius:50%;

  background:#031f1b;

  border:2px solid #125b4d;

  font-size:18px;
  font-weight:900;

  transition:.18s;

  box-shadow:
    inset 0 0 15px #00c88b0c,
    0 0 8px #00c88b12;
}

.answer:active{
  transform:scale(.94);
}

.answer.selected{
  border-color:#a6ff70;
  box-shadow:
    0 0 18px #73ff76aa,
    inset 0 0 15px #64ff6c22;
}

.answer.correct{
  border-color:#78ff75;
  background:#095a3f;
  box-shadow:0 0 25px #5dff74aa;
}

.answer.wrong{
  border-color:#ff5e69;
  background:#57232b;
  animation:shake .25s;
}

@keyframes shake{
  25%{transform:translateX(-5px)}
  50%{transform:translateX(5px)}
  75%{transform:translateX(-4px)}
}

/* ================= TOOLS ================= */

.tools{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:8px;
}

.tool{
  aspect-ratio:1/1;
  min-width:0;

  border-radius:50%;

  background:#052c25;

  border:2px solid #126950;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;

  font-weight:bold;

  box-shadow:0 0 12px #00c88b12;
}

.tool .icon{
  font-size:28px;
  line-height:1;
  margin-bottom:5px;
}

.tool small{
  font-size:13px;
}

.tool b{
  color:#ffd83d;
  font-size:14px;
}

.tool:active{
  transform:scale(.93);
}

.tool:disabled{
  opacity:.35;
}

/* ================= STATS ================= */

.stats{
  margin-top:12px;

  display:grid;
  grid-template-columns:repeat(3,1fr);

  border:2px solid #125b4d;
  border-radius:30px;

  background:#03251f;
  overflow:hidden;
}

.stat{
  text-align:center;
  padding:10px 5px;
}

.stat b{
  display:block;
  color:#ffd83d;
  font-size:25px;
  margin-bottom:3px;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  background:#000b;

  padding:15px;

  z-index:1000;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(500px,100%);
  max-height:85vh;
  overflow:auto;

  padding:20px;

  border-radius:25px;

  background:#052b24;

  border:2px solid #18765f;
}

.modalBox h2{
  color:#65e9a6;
}

.close{
  float:left;

  width:40px;
  height:40px;

  border-radius:50%;

  background:#123c34;
}

/* ================= MODAL ITEMS ================= */

.catGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.cat{
  padding:15px;
  border-radius:18px;

  background:#07352c;
  border:1px solid #196653;
}

.row{
  display:flex;
  justify-content:space-between;

  padding:12px;

  margin:7px 0;

  border-radius:14px;

  background:#07352c;
  border:1px solid #155d4d;
}

.badges{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.badge{
  padding:13px;
  border-radius:15px;
  background:#07352c;
}

.badge.lock{
  opacity:.3;
}

/* ================= TOAST ================= */

#toast{
  position:fixed;

  left:50%;
  bottom:18px;

  transform:translate(-50%,30px);

  opacity:0;

  z-index:2000;

  background:#062b24;
  border:2px solid #228366;

  padding:12px 18px;

  border-radius:20px;

  font-weight:bold;

  transition:.25s;

  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================= CONFETTI ================= */

.confetti{
  position:fixed;
  top:-20px;

  width:8px;
  height:15px;

  z-index:1500;

  animation:fall 1.2s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}

/* ================= MOBILE ================= */

@media(max-width:430px){

  .app{
    padding:7px;
  }

  .header{
    gap:3px;
  }

  .circleStat{
    width:61px;
    height:61px;
  }

  .circleStat b{
    font-size:20px;
  }

  .logo{
    font-size:25px;
  }

  .logo span{
    font-size:20px;
  }

  .game{
    padding:10px;
    border-radius:28px;
  }

  .question{
    min-height:115px;
  }

  .questionText{
    font-size:23px;
  }

  .answer{
    min-height:75px;
    font-size:17px;
  }

  .tools{
    grid-template-columns:repeat(4,1fr);
    gap:6px;
  }

  .tool .icon{
    font-size:23px;
  }

  .tool small{
    font-size:11px;
  }
}

@media(max-width:350px){

  .circleStat{
    width:55px;
    height:55px;
  }

  .circleStat b{
    font-size:18px;
  }

  .logo{
    font-size:21px;
  }

  .answer{
    min-height:65px;
    font-size:15px;
  }

  .tool .icon{
    font-size:20px;
  }

  .tool small{
    font-size:10px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= HEADER ================= -->

<header class="header">

  <div class="circleStat">
    🔊
    <small id="soundStatus">صوت</small>
  </div>

  <div class="circleStat">
    🔥
    <b id="streak">0</b>
  </div>

  <div class="logo">
    👑 عمار
    <span>الأسطورة</span>
  </div>

  <div class="circleStat">
    ⭐
    <b id="xp">0</b>
  </div>

  <div class="circleStat">
    🏆
    <b id="score">0</b>
  </div>

</header>


<!-- ================= PROGRESS ================= -->

<div class="progress">

  <div class="progressTop">

    <span id="stage">
      المرحلة 1/100
    </span>

    <span id="questionNumber">
      السؤال 1/5
    </span>

  </div>

  <div class="progressBar">
    <span id="progressBar"></span>
  </div>

</div>


<!-- ================= GAME ================= -->

<main class="game">

  <div
    id="category"
    class="category">
    📚 ثقافة عامة
  </div>


  <div class="question">

    <div
      id="questionText"
      class="questionText">

      جاري تحميل السؤال...

    </div>

  </div>


  <div
    id="answers"
    class="answers">
  </div>


  <!-- ================= TOOLS ================= -->

  <div class="tools">

    <button
      id="helpBtn"
      class="tool"
      onclick="help()">

      <span class="icon">💡</span>
      <small>مساعدة</small>
      <b id="helpCount">3 ⭐</b>

    </button>


    <button
      id="skipBtn"
      class="tool"
      onclick="skipQuestion()">

      <span class="icon">⏭️</span>
      <small>تخطي</small>
      <b id="skipCount">5 ⭐</b>

    </button>


    <button
      class="tool"
      onclick="randomQuestion()">

      <span class="icon">🎲</span>
      <small>سؤال جديد</small>
      <b>4 ⭐</b>

    </button>


    <button
      id="revealBtn"
      class="tool"
      onclick="revealAnswer()">

      <span class="icon">👁️</span>
      <small>كشف</small>
      <b id="revealCount">8 ⭐</b>

    </button>


    <button
      class="tool"
      onclick="openCategories()">

      <span class="icon">🗺️</span>
      <small>الخريطة</small>

    </button>


    <button
      class="tool"
      onclick="showStats()">

      <span class="icon">📊</span>
      <small>إحصائيات</small>

    </button>


    <button
      class="tool"
      onclick="showLeaderboard()">

      <span class="icon">🏆</span>
      <small>لوحة الصدارة</small>

    </button>


    <button
      class="tool"
      onclick="showBadges()">

      <span class="icon">🎁</span>
      <small>مكافآتي</small>

    </button>


    <button
      class="tool"
      onclick="toggleSound()">

      <span class="icon">⚙️</span>
      <small>الإعدادات</small>

    </button>

  </div>


  <!-- ================= STATS ================= -->

  <div class="stats">

    <div class="stat">
      <b id="correct">0</b>
      ✅ صحيح
    </div>

    <div class="stat">
      <b id="multiplier">1×</b>
      ⭐ المضاعف
    </div>

    <div class="stat">
      <b id="bestStreak">0</b>
      🔥 السلسلة
    </div>

  </div>

</main>

</div>


<!-- ================= MODAL ================= -->

<div
  id="modal"
  class="modal">

  <div class="modalBox">

    <button
      class="close"
      onclick="closeModal()">
      ✕
    </button>

    <div id="modalContent"></div>

  </div>

</div>


<div id="toast"></div>


<script>

/* =========================================================
   الأسئلة
========================================================= */

const QUESTIONS = [

/* ثقافة عامة */

{
 category:"general",
 question:"ما عاصمة اليابان؟",
 answers:["طوكيو","بكين","سيول","بانكوك"],
 correct:0
},

{
 category:"general",
 question:"كم عدد أيام الأسبوع؟",
 answers:["5","6","7","8"],
 correct:2
},

{
 category:"general",
 question:"ما أكبر محيط في العالم؟",
 answers:["الأطلسي","الهندي","الهادئ","المتجمد الشمالي"],
 correct:2
},

{
 category:"general",
 question:"ما الكوكب المعروف بالكوكب الأحمر؟",
 answers:["الزهرة","المريخ","المشتري","عطارد"],
 correct:1
},

{
 category:"general",
 question:"كم دقيقة في الساعة؟",
 answers:["30","45","60","90"],
 correct:2
},

{
 category:"general",
 question:"ما الحيوان المعروف بسفينة الصحراء؟",
 answers:["الحصان","الجمل","الفيل","الغزال"],
 correct:1
},

{
 category:"general",
 question:"كم عدد قارات العالم؟",
 answers:["5","6","7","8"],
 correct:2
},

{
 category:"general",
 question:"ما أسرع حيوان بري؟",
 answers:["الفهد","الأسد","الحصان","النمر"],
 correct:0
},

/* تاريخ */

{
 category:"history",
 question:"من بنى الأهرامات في الجيزة؟",
 answers:["الرومان","المصريون القدماء","الفُرس","الفايكنغ"],
 correct:1
},

{
 category:"history",
 question:"ما عاصمة الدولة العباسية؟",
 answers:["دمشق","بغداد","القاهرة","قرطبة"],
 correct:1
},

{
 category:"history",
 question:"أين تقع مدينة البتراء؟",
 answers:["الأردن","مصر","العراق","المغرب"],
 correct:0
},

{
 category:"history",
 question:"من الرحالة المغربي الشهير؟",
 answers:["ابن بطوطة","ابن سينا","الخوارزمي","الطبري"],
 correct:0
},

/* رياضة */

{
 category:"sports",
 question:"كم لاعباً في فريق كرة القدم داخل الملعب؟",
 answers:["9","10","11","12"],
 correct:2
},

{
 category:"sports",
 question:"كم حلقة في شعار الألعاب الأولمبية؟",
 answers:["4","5","6","7"],
 correct:1
},

{
 category:"sports",
 question:"ما الرياضة التي تستخدم المضرب والكرة الصفراء؟",
 answers:["التنس","الملاكمة","السباحة","الجودو"],
 correct:0
},

{
 category:"sports",
 question:"كم نقطة للرمية الحرة في كرة السلة؟",
 answers:["1","2","3","4"],
 correct:0
},

/* علوم */

{
 category:"science",
 question:"ما الغاز الذي يحتاجه الإنسان للتنفس؟",
 answers:["الأكسجين","الهيليوم","الهيدروجين","النيتروجين"],
 correct:0
},

{
 category:"science",
 question:"ما وحدة قياس القوة؟",
 answers:["واط","نيوتن","فولت","أمبير"],
 correct:1
},

{
 category:"science",
 question:"ما أقرب نجم إلى الأرض؟",
 answers:["الشمس","سيريوس","النسر","الشعرى"],
 correct:0
},

{
 category:"science",
 question:"ما العضو الذي يضخ الدم؟",
 answers:["الكبد","القلب","الرئة","المعدة"],
 correct:1
},

{
 category:"science",
 question:"ما أكبر كوكب في المجموعة الشمسية؟",
 answers:["زحل","الأرض","المشتري","نبتون"],
 correct:2
},

/* تكنولوجيا */

{
 category:"tech",
 question:"ماذا تعني CPU؟",
 answers:[
 "وحدة المعالجة المركزية",
 "وحدة التخزين",
 "شبكة الحاسوب",
 "ذاكرة الرسوم"
 ],
 correct:0
},

{
 category:"tech",
 question:"ما اللغة الأساسية لبناء هيكل صفحات الويب؟",
 answers:["HTML","SQL","Python","C"],
 correct:0
},

{
 category:"tech",
 question:"ما اللغة المستخدمة لتنسيق صفحات الويب؟",
 answers:["CSS","SQL","Bash","Python"],
 correct:0
},

{
 category:"tech",
 question:"ما امتداد JavaScript؟",
 answers:[".js",".jpg",".mp3",".exe"],
 correct:0
},

{
 category:"tech",
 question:"ما الذي يحفظ البيانات داخل متصفح المستخدم؟",
 answers:["localStorage","HDMI","GPS","FTP"],
 correct:0
},

/* إسلاميات */

{
 category:"islamic",
 question:"كم عدد الصلوات المفروضة؟",
 answers:["3","4","5","6"],
 correct:2
},

{
 category:"islamic",
 question:"في أي شهر يصوم المسلمون؟",
 answers:["شوال","رمضان","محرم","رجب"],
 correct:1
},

{
 category:"islamic",
 question:"ما أول سورة في المصحف؟",
 answers:["البقرة","الفاتحة","الإخلاص","الناس"],
 correct:1
},

{
 category:"islamic",
 question:"كم عدد أركان الإسلام؟",
 answers:["4","5","6","7"],
 correct:1
},

{
 category:"islamic",
 question:"إلى أي مدينة كانت الهجرة النبوية؟",
 answers:["الطائف","المدينة المنورة","القدس","دمشق"],
 correct:1
},

{
 category:"islamic",
 question:"ما السورة التي تسمى أم الكتاب؟",
 answers:["الفاتحة","الكهف","يس","الملك"],
 correct:0
}

];


/* =========================================================
   أسماء الفئات
========================================================= */

const CATEGORY_NAMES={

 all:"🌍 جميع الفئات",

 general:"📚 ثقافة عامة",

 history:"🏺 تاريخ",

 sports:"⚽ رياضة",

 science:"🔬 علوم",

 tech:"💻 تكنولوجيا",

 islamic:"🕌 إسلاميات"

};


/* =========================================================
   حالة اللعبة
========================================================= */

let state =
JSON.parse(
localStorage.getItem("ammarLegend")
) || {

 score:0,
 xp:0,

 stage:1,

 correct:0,
 answered:0,

 streak:0,
 bestStreak:0,

 skips:5,
 helps:3,
 reveals:8,

 sound:true,

 category:"all",

 achievements:[]

};


let currentQuestion=null;

let locked=false;


/* =========================================================
   حفظ
========================================================= */

function save(){

 localStorage.setItem(
  "ammarLegend",
  JSON.stringify(state)
 );

}


/* =========================================================
   الأسئلة المتاحة
========================================================= */

function getQuestions(){

 if(state.category==="all"){
  return QUESTIONS;
 }

 return QUESTIONS.filter(
  q=>q.category===state.category
 );

}


/* =========================================================
   سؤال جديد
========================================================= */

function newQuestion(){

 locked=false;

 const list=getQuestions();

 currentQuestion=
 list[
  Math.floor(
   Math.random()*list.length
  )
 ];

 renderQuestion();

}


/* =========================================================
   عرض السؤال
========================================================= */

function renderQuestion(){

 document.getElementById(
  "questionText"
 ).textContent=
 currentQuestion.question;


 document.getElementById(
  "category"
 ).textContent=
 CATEGORY_NAMES[
  currentQuestion.category
 ];


 const answers=
 document.getElementById("answers");

 answers.innerHTML="";


 currentQuestion.answers.forEach(
 (text,index)=>{

  const button=
  document.createElement("button");

  button.className="answer";

  button.textContent=text;

  button.onclick=()=>answer(index);

  answers.appendChild(button);

 });

 updateUI();

}


/* =========================================================
   أهم جزء:
   الإجابة الصحيحة تنتقل تلقائياً
========================================================= */

function answer(index){

 if(locked)return;

 const buttons=
 document.querySelectorAll(".answer");

 locked=true;

 buttons.forEach(
  b=>b.disabled=true
 );


 /* الإجابة صحيحة */

 if(index===currentQuestion.correct){

  buttons[index]
   .classList.add("correct");

  state.correct++;
  state.answered++;

  state.streak++;

  state.bestStreak=
   Math.max(
    state.bestStreak,
    state.streak
   );


  const multiplier=
   Math.min(
    5,
    1+
    Math.floor(
     state.streak/3
    )
   );


  const points=
   100*multiplier;


  state.score+=points;

  state.xp+=25;


  state.stage=
   Math.min(
    100,
    1+
    Math.floor(
     state.correct/5
    )
   );


  correctSound();

  confetti();

  checkAchievements();

  toast(
   "✅ صحيح! +"+
   points+
   " نقطة"
  );


  save();

  updateUI();


  /* الانتقال التلقائي */

  setTimeout(
   ()=>{
    newQuestion();
   },
   900
  );


 }else{

  /* خطأ */

  buttons[index]
   .classList.add("wrong");

  buttons[
   currentQuestion.correct
  ]
   .classList.add("correct");


  state.answered++;

  state.streak=0;

  state.xp+=5;


  wrongSound();

  toast(
   "❌ إجابة خاطئة"
  );


  save();

  updateUI();


  /* السؤال التالي تلقائياً */

  setTimeout(
   ()=>{
    newQuestion();
   },
   1200
  );

 }

}

function help(){

  toast("💡 لا توجد مساعدات");

 const buttons=
 Array.from(
  document.querySelectorAll(".answer")
 );

  }
 );

}

/* =========================================================
   الصوت
========================================================= */

function beep(
 frequency,
 duration
){

 if(!state.sound)return;

 try{

  const AudioContext=
   window.AudioContext||
   window.webkitAudioContext;

  if(!AudioContext)return;

  const ctx=
   window.audioContext||
   (
    window.audioContext=
    new AudioContext()
   );


  const oscillator=
   ctx.createOscillator();

  const gain=
   ctx.createGain();


  oscillator.connect(gain);

  gain.connect(
   ctx.destination
  );


  oscillator.frequency.value=
   frequency;


  gain.gain.value=.06;


  oscillator.start();


  setTimeout(
   ()=>{
    oscillator.stop();
   },
   duration
  );

 }catch(e){}

}


function correctSound(){

 beep(700,100);

 setTimeout(
  ()=>beep(900,120),
  100
 );

}


function wrongSound(){

 beep(180,200);

}

 state.sound=
  !state.sound;

 document.getElementById(

 ?"صوت"

 );

}

/* =========================================================
   Toast
========================================================= */

let toastTimer;

function toast(text){

 const t=
  document.getElementById("toast");

 t.textContent=text;

 t.classList.add("show");

 clearTimeout(toastTimer);

 toastTimer=
  setTimeout(
   ()=>{
    t.classList.remove("show");
   },
   1700
  );

}
