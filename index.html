<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الكلمات الأسطوري - عمار بن ياسر</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at center, #064e3b, #022c22, #021f18);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* خلفية متحركة بتصميم مختلف (لون أخضر زمردي فخم) */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #10b981, #059669);
            filter: blur(130px);
            border-radius: 50%;
            z-index: 0;
            opacity: 0.35;
            animation: floatGlow 9s ease-in-out infinite alternate;
        }

        @keyframes floatGlow {
            0% { transform: translate(-40px, -40px) scale(1); }
            100% { transform: translate(40px, 40px) scale(1.15); }
        }

        .watermark {
            position: absolute;
            bottom: 15px;
            left: 20px;
            font-size: 30px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.04);
            pointer-events: none;
            z-index: 1;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            max-width: 450px;
            width: 90%;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .main-title {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #34d399, #6ee7b7, #a7f3d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .sub-title {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* صندوق الوصف أو اللغز */
        .clue-box {
            font-size: 18px;
            margin-bottom: 20px;
            color: #f8fafc;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.25);
            padding: 15px;
            border-radius: 14px;
            border-right: 4px solid #10b981;
        }

        /* مربعات الإجابة (الكلمة المجهولة) */
        .answer-slots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            min-height: 50px;
        }

        .slot {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            color: #34d399;
        }

        .slot.filled {
            border: 2px solid #34d399;
            background: rgba(16, 185, 129, 0.2);
        }

        /* الحروف المبعثرة (مثل كراش) */
        .letters-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .letter-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            border: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.4);
            transition: all 0.2s ease;
        }

        .letter-btn:active {
            transform: scale(0.9);
        }

        .letter-btn.used {
            opacity: 0.3;
            pointer-events: none;
        }

        /* أزرار التحكم والرسائل */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-clear {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .btn-submit {
            background: #10b981;
            color: white;
        }

        .message {
            font-size: 15px;
            margin-top: 12px;
            font-weight: bold;
            min-height: 22px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
        }
        .footer strong {
            color: #34d399;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="watermark">عمار بن ياسر</div>

    <div class="game-container">
        <div class="main-title">تحدي الكلمات</div>
        <div class="sub-title">⚡ فكر، اجمع الحروف، وحل اللغز ⚡</div>

        <div class="clue-box" id="clueText">جاري تحميل اللغز...</div>

        <!-- خانات الحروف المجمعة -->
        <div class="answer-slots" id="answerSlots"></div>

        <!-- الحروف المبعثرة للاختيار منها -->
        <div class="letters-grid" id="lettersGrid"></div>

        <div class="controls">
            <button class="action-btn btn-clear" onclick="clearSelection()">حذف الكل 🔄</button>
            <button class="action-btn btn-submit" onclick="checkWord()">تحقق ✅</button>
        </div>

        <div class="message" id="messageText"></div>

        <div class="footer">
            تصميم وتطوير: <strong>عمار أصلاوي</strong>
        </div>
    </div>

    <script>
        // مراحل اللعبة (اللغز + الكلمة الصحيحة + الحروف المبعثرة)
        const levels = [
            { clue: "حيوان يُسمى سفينة الصحراء؟", word: "جمل", scrambled: "لمج" },
            { clue: "عاصمة دولة اليابان؟", word: "طوكيو", scrambled: "يوتكو" },
            { clue: "أكبر كوكب في المجموعة الشمسية؟", word: "المشتري", scrambled: "ريتمشال" },
            { clue: "عنصر كيميائي رمزه O؟", word: "أكسجين", scrambled: "نيجكسأ" }
        ];

        let currentLevel = parseInt(localStorage.getItem("mesh_level")) || 0;
        let selectedLetters = [];

        function initLevel() {
            if (currentLevel >= levels.length) {
                document.querySelector(".game-container").innerHTML = `
                    <div class="main-title" style="font-size: 28px;">عمار بن ياسر</div>
                    <h1 style="color:#34d399; font-size:24px; margin:15px 0;">🏆 أسطورة الكلمات!</h1>
                    <p style="color:#cbd5e1; font-size:16px; margin-bottom:20px;">أتممت جميع مراحل تحدي الكلمات بنجاح!</p>
                    <button class="action-btn btn-submit" onclick="resetGame()" style="width:100%; padding:12px;">إعادة اللعب من جديد 🔄</button>
                    <div class="footer" style="margin-top: 25px;">تصميم وتطوير: <strong>عمار أصلاوي</strong></div>
                `;
                return;
            }

            const data = levels[currentLevel];
            document.getElementById("clueText").innerText = `لغز رقم (${currentLevel + 1}): ${data.clue}`;
            selectedLetters = [];
            document.getElementById("messageText").innerText = "";

            renderSlots();
            renderLetters();
        }

        function renderSlots() {
            const slotsContainer = document.getElementById("answerSlots");
            slotsContainer.innerHTML = "";
            const wordLength = levels[currentLevel].word.length;

            for (let i = 0; i < wordLength; i++) {
                const slot = document.createElement("div");
                slot.className = "slot" + (selectedLetters[i] ? " filled" : "");
                slot.innerText = selectedLetters[i] || "";
                slotsContainer.appendChild(slot);
            }
        }

        function renderLetters() {
            const gridContainer = document.getElementById("lettersGrid");
            gridContainer.innerHTML = "";
            const scrambled = levels[currentLevel].scrambled;

            scrambled.split("").forEach((char, index) => {
                const btn = document.createElement("button");
                btn.className = "letter-btn";
                btn.innerText = char;
                
                // التحقق إذا كان الحرف تم استخدامه
                const usedCount = selectedLetters.filter(l => l === char).length;
                const totalInScrambled = scrambled.split("").filter(l => l === char).length;
                
                // زر تفاعلي للاختيار
                btn.onclick = () => {
                    if (selectedLetters.length < levels[currentLevel].word.length) {
                        selectedLetters.push(char);
                        renderSlots();
                        renderLetters();
                    }
                };
                
                gridContainer.appendChild(btn);
            });
        }

        function clearSelection() {
            selectedLetters = [];
            renderSlots();
            renderLetters();
        }

        function checkWord() {
            const targetWord = levels[currentLevel].word;
            const userWord = selectedLetters.join("");
            const msg = document.getElementById("messageText");

            if (userWord === targetWord) {
                msg.style.color = "#34d399";
                msg.innerText = "✨ إجابة صحيحة وأسطورية!";
                currentLevel++;
                localStorage.setItem("mesh_level", currentLevel);
                setTimeout(initLevel, 1200);
            } else {
                msg.style.color = "#f87171";
                msg.innerText = "❌ الكلمة غير صحيحة، حاول مجدداً!";
            }
        }

        function resetGame() {
            localStorage.clear();
            currentLevel = 0;
            location.reload();
        }

        initLevel();
    </script>
</body>
</html>
