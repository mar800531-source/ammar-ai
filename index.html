<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#061b18">

<title>عمار الأسطورة 👑</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  font-family:
    Arial,
    Tahoma,
    sans-serif;

  color:#effffb;

  background:
    radial-gradient(
      circle at 50% -10%,
      #08735a 0%,
      #08372e 35%,
      #041815 100%
    );
}

button{
  font:inherit;
  cursor:pointer;
  border:0;
}

.app{
  width:min(720px,100%);
  margin:auto;
  padding:15px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.logo{
  font-size:clamp(28px,7vw,45px);
  font-weight:900;

  background:
    linear-gradient(
      90deg,
      #54e5a6,
      #5be8ed
    );

  -webkit-background-clip:text;
  color:transparent;
}

.pills{
  display:flex;
  gap:7px;
}

.pill{
  padding:9px 13px;
  border-radius:22px;

  background:#0b382f;
  border:1px solid #1a5d4e;

  font-weight:bold;
}

.progress{
  padding:16px;

  border-radius:22px;

  background:#082a24;
  border:1px solid #165045;

  margin-bottom:17px;
}

.progressLine{
  display:flex;
  justify-content:space-between;
  color:#d8eee9;
}

.bar{
  height:10px;
  background:#17473d;

  border-radius:20px;

  margin-top:12px;

  overflow:hidden;
}

.bar span{
  display:block;
  width:1%;
  height:100%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #09c58d,
      #5ce8ed
    );

  transition:.4s;
}

.panel{
  padding:20px;

  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      #092d27ee,
      #061e1add
    );

  border:1px solid #185247;

  box-shadow:
    0 20px 60px #0006;
}

.title{
  text-align:center;
}

.title h1{
  margin:5px 0;

  font-size:
    clamp(30px,8vw,52px);

  background:
    linear-gradient(
      90deg,
      #55e7a8,
      #61e8ee
    );

  -webkit-background-clip:text;
  color:transparent;
}

.title p{
  color:#94bbb4;
}

.category{
  color:#59e6ea;
  font-weight:bold;
}

.question{
  margin-top:20px;

  min-height:160px;

  display:flex;
  justify-content:center;
  align-items:center;

  text-align:center;

  padding:20px;

  border-radius:25px;

  background:
    linear-gradient(
      145deg,
      #06251f,
      #061a17
    );

  border-right:
    5px solid #09c58d;
}

.questionText{
  font-size:
    clamp(23px,5.8vw,35px);

  font-weight:900;
  line-height:1.5;
}

.answers{
  display:grid;
  gap:10px;
  margin-top:15px;
}

.answer{
  padding:15px;

  text-align:right;

  border-radius:17px;

  background:#0c342e;

  color:white;

  border:1px solid #19584c;

  font-size:17px;
  font-weight:bold;

  transition:.2s;
}

.answer:active{
  transform:scale(.98);
}

.answer.selected{
  outline:3px solid #54e6d0;
}

.answer.correct{
  background:#096548;
  border-color:#26e5aa;
}

.answer.wrong{
  background:#682d34;
  border-color:#ff7d84;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;

  margin-top:15px;
}

.btn{
  padding:16px;

  border-radius:18px;

  font-size:18px;
  font-weight:900;
}

.check{
  background:
    linear-gradient(
      135deg,
      #08c48b,
      #08a77e
    );

  color:white;
}

.clear{
  background:#292b27;
  color:#ffb4b9;
  border:1px solid #51463c;
}

.tools{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);

  gap:9px;

  margin-top:12px;
}

.tool{
  min-height:68px;

  padding:10px;

  border-radius:17px;

  color:white;

  background:#0b302b;

  border:1px solid #174c43;

  font-weight:bold;
}

.tool small{
  display:block;
  margin-top:4px;
  color:#c9e7e1;
}

.tool:disabled{
  opacity:.35;
}

.stats{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

  margin-top:13px;
}

.stat{
  text-align:center;

  padding:10px;

  border-radius:17px;

  background:#0b312b;

  border:1px solid #174b42;
}

.stat b{
  display:block;

  color:#ffd34e;

  font-size:21px;
}

.notice{
  margin-top:14px;

  padding:13px;

  text-align:center;

  border-radius:18px;

  background:#0a302a;

  border:1px solid #14584c;
}

.modal{
  position:fixed;

  inset:0;

  background:#000b;

  display:none;

  justify-content:center;
  align-items:center;

  padding:15px;

  z-index:100;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(560px,100%);
  max-height:90vh;

  overflow:auto;

  padding:22px;

  border-radius:25px;

  background:#08251f;

  border:1px solid #24685a;

  box-shadow:0 25px 80px #000;
}

.modalBox h2{
  color:#5de8e9;
}

.close{
  float:left;

  padding:7px 12px;

  border-radius:12px;

  background:#183b35;

  color:white;
}

.list{
  display:grid;
  gap:8px;
}

.row{
  display:flex;

  justify-content:space-between;

  gap:10px;

  padding:12px;

  border-radius:14px;

  background:#0d342e;

  border:1px solid #1b5046;
}

.row.me{
  border-color:#ffd34e;
}

.categories{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;
}

.cat{
  padding:16px;

  border-radius:17px;

  background:#0c342e;

  color:white;

  border:1px solid #1a574b;

  font-weight:bold;
}

.cat.active{
  background:#0b4b3d;

  border-color:#22dba9;
}

.badges{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;
}

.badge{
  padding:14px;

  border-radius:16px;

  background:#0d342e;

  border:1px solid #1b5046;
}

.badge b{
  display:block;

  color:#ffd34e;

  margin-bottom:5px;
}

.badge.lock{
  opacity:.35;
}

#toast{
  position:fixed;

  bottom:20px;
  left:50%;

  transform:
    translate(-50%,30px);

  opacity:0;

  padding:13px 18px;

  border-radius:16px;

  background:#082a24;

  border:1px solid #2d7868;

  font-weight:bold;

  z-index:200;

  transition:.25s;

  text-align:center;
}

#toast.show{
  transform:
    translate(-50%,0);

  opacity:1;
}

.confetti{
  position:fixed;

  top:-20px;

  width:9px;
  height:15px;

  z-index:150;

  animation:
    fall 1.2s linear forwards;
}

@keyframes fall{
  to{
    transform:
      translateY(110vh)
      rotate(720deg);

    opacity:0;
  }
}

@media(max-width:470px){

  .app{
    padding:10px;
  }

  .panel{
    padding:15px;
  }

  .tools{
    grid-template-columns:
      1fr 1fr;
  }

  .questionText{
    font-size:22px;
  }

  .logo{
    font-size:29px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="top">

<div class="logo">
👑 عمار الأسطورة
</div>

<div class="pills">

<div class="pill">
🏆 <span id="score">0</span>
</div>

<div class="pill">
⭐ <span id="xp">0</span>
</div>

</div>

</header>


<div class="progress">

<div class="progressLine">

<span id="questionNumber">
السؤال 1/5
</span>

<span id="stage">
المرحلة 1 من 100
</span>

</div>

<div class="bar">
<span id="progressBar"></span>
</div>

</div>


<section class="panel">


<div class="title">

<h1>
⚡ تحدي الكلمات الأسطوري
</h1>

<p>
أسئلة متنوعة • 100 مرحلة • إنجازات ومكافآت
</p>

<div class="category" id="category">
📚 ثقافة عامة
</div>

</div>


<div class="question">

<div
id="questionText"
class="questionText">

جاري تحميل السؤال...

</div>

</div>


<div
id="answers"
class="answers">
</div>


<div class="buttons">

<button
class="btn check"
onclick="checkAnswer()">

✅ تحقق

</button>

<button
class="btn clear"
onclick="clearAnswer()">

↩️ حذف الحل

</button>

</div>


<div class="tools">

<button
class="tool"
onclick="openCategories()">

🗺️
<small>الفئات</small>

</button>


<button
id="skipBtn"
class="tool"
onclick="skipQuestion()">

⏭️ تخطي
<small>
<span id="skipCount">5</span>
</small>

</button>


<button
id="helpBtn"
class="tool"
onclick="help()">

💡 مساعدة
<small>
<span id="helpCount">3</span>
</small>

</button>


<button
class="tool"
onclick="showStats()">

📊
<small>إحصائيات</small>

</button>


<button
class="tool"
onclick="toggleSound()">

🔊
<small id="soundText">الصوت</small>

</button>


<button
class="tool"
onclick="randomQuestion()">

🎲
<small>سؤال جديد</small>

</button>


<button
class="tool"
onclick="showBadges()">

🎁
<small>مكافآتي</small>

</button>


<button
class="tool"
onclick="showLeaderboard()">

🏆
<small>الصدارة</small>

</button>


<button
id="revealBtn"
class="tool"
onclick="revealAnswer()">

👁️
<small>
كشف <span id="revealCount">8</span>
</small>

</button>

</div>


<div class="notice">

🎯 التحدي:
أجب دون أخطاء لتحصل على مضاعف النقاط!

</div>


<div class="stats">

<div class="stat">

<b id="streak">
0
</b>

🔥 السلسلة

</div>


<div class="stat">

<b id="multiplier">
1×
</b>

⭐ المضاعف

</div>


<div class="stat">

<b id="correct">
0
</b>

✅ صحيح

</div>

</div>

</section>

</div>


<div
id="modal"
class="modal">

<div class="modalBox">

<button
class="close"
onclick="closeModal()">

✕

</button>

<div id="modalContent"></div>

</div>

</div>


<div id="toast"></div>


<script>

/*
================================================
الإصلاح الأساسي
================================================

لا يوجد:

fetch()
JSON خارجي
API خارجي
ملف أسئلة خارجي

لذلك GitHub Pages لن يعلق
على "جاري تحميل السؤال".
*/


const QUESTIONS = [

/* ثقافة عامة */

{

answers:["طوكيو","بكين","سيول","بانكوك"],

},

},

{

},

{

answers:["30","45","60","90"],

},

{
category:"general",
question:"ما الحيوان المعروف بسفينة الصحراء؟",
answers:["الحصان","الجمل","الفيل","الغزال"],
correct:1
},


/* تاريخ */

{
category:"history",
question:"من بنى الأهرامات في الجيزة؟",
answers:[
"الرومان",
"المصريون القدماء",
"الفُرس",
"الفايكنغ"
],
correct:1
},

{
category:"history",
question:"ما عاصمة الدولة العباسية؟",
answers:[
"دمشق",
"بغداد",
"القاهرة",
"قرطبة"
],
correct:1
},

{
category:"history",
question:"أين تقع مدينة البتراء؟",
answers:[
"الأردن",
"مصر",
"العراق",
"المغرب"
],
correct:0
},

{
category:"history",
question:"من الرحالة المغربي الشهير؟",
answers:[
"ابن بطوطة",
"ابن سينا",
"الخوارزمي",
"الطبري"
],
correct:0
},


/* رياضة */

{
category:"sports",
question:"كم لاعباً في فريق كرة القدم داخل الملعب؟",
answers:["9","10","11","12"],
correct:2
},

{
category:"sports",
question:"كم حلقة في شعار الألعاب الأولمبية؟",
answers:["4","5","6","7"],
correct:1
},

{
category:"sports",
question:"ما الرياضة التي تستخدم المضرب والكرة الصفراء؟",
answers:[
"التنس",
"الملاكمة",
"السباحة",
"الجودو"
],
correct:0
},

{
category:"sports",
question:"كم نقطة للرمية الحرة في كرة السلة؟",
answers:["1","2","3","4"],
correct:0
},


/* علوم */

{
category:"science",
question:"ما الغاز الذي يحتاجه الإنسان للتنفس؟",
answers:[
"الأكسجين",
"الهيليوم",
"الهيدروجين",
"النيتروجين فقط"
],
correct:0
},

{
category:"science",
question:"ما وحدة قياس القوة؟",
answers:[
"واط",
"نيوتن",
"فولت",
"أمبير"
],
correct:1
},

{
category:"science",
question:"ما أقرب نجم إلى الأرض؟",
answers:[
"الشمس",
"سيريوس",
"النسر",
"الشعرى"
],
correct:0
},

{
category:"science",
question:"ما العضو الذي يضخ الدم؟",
answers:[
"الكبد",
"القلب",
"الرئة",
"المعدة"
],
correct:1
},

{
category:"science",
question:"ما أكبر كوكب في المجموعة الشمسية؟",
answers:[
"زحل",
"الأرض",
"المشتري",
"نبتون"
],
correct:2
},


/* تكنولوجيا */

{
category:"tech",
question:"ماذا تعني CPU؟",
answers:[
"وحدة المعالجة المركزية",
"وحدة التخزين",
"شبكة الحاسوب",
"ذاكرة الرسوم"
],
correct:0
},

{
category:"tech",
question:"ما اللغة الأساسية لبناء هيكل صفحات الويب؟",
answers:[
"HTML",
"SQL",
"Python",
"C"
],
correct:0
},

{
category:"tech",
question:"ما اللغة المستخدمة لتنسيق صفحات الويب؟",
answers:[
"CSS",
"SQL",
"Bash",
"Python"
],
correct:0
},

{
category:"tech",
question:"ما امتداد JavaScript؟",
answers:[
".js",
".jpg",
".mp3",
".exe"
],
correct:0
},

{
category:"tech",
question:"ما الذي يحفظ البيانات داخل متصفح المستخدم؟",
answers:[
"localStorage",
"HDMI",
"GPS",
"FTP"
],
correct:0
},


/* إسلاميات */

{
category:"islamic",
question:"كم عدد الصلوات المفروضة؟",
answers:["3","4","5","6"],
correct:2
},

{
category:"islamic",
question:"في أي شهر يصوم المسلمون؟",
answers:[
"شوال",
"رمضان",
"محرم",
"رجب"
],
correct:1
},

{
category:"islamic",
question:"ما أول سورة في المصحف؟",
answers:[
"البقرة",
"الفاتحة",
"الإخلاص",
"الناس"
],
correct:1
},

{
category:"islamic",
question:"كم عدد أركان الإسلام؟",
answers:["4","5","6","7"],
correct:1
},

{
category:"islamic",
question:"إلى أي مدينة كانت الهجرة النبوية؟",
answers:[
"الطائف",
"المدينة المنورة",
"القدس",
"دمشق"
],
correct:1
},

{
category:"islamic",
question:"ما السورة التي تسمى أم الكتاب؟",
answers:[
"الفاتحة",
"الكهف",
"يس",
"الملك"
],
correct:0
}

];


const CATEGORY_NAMES = {

general:"📚 ثقافة عامة",

history:"🏺 تاريخ",

sports:"⚽ رياضة",

science:"🔬 علوم",

tech:"💻 تكنولوجيا",

islamic:"🕌 إسلاميات"

};


let state =
JSON.parse(
localStorage.getItem("legendGame")
) || {

score:0,

xp:0,

stage:1,

correct:0,

answered:0,

streak:0,

bestStreak:0,

skips:5,

helps:3,

reveals:8,

sound:true,

category:"all",

achievements:[]

};


let currentQuestion=null;

let selectedAnswer=null;

let locked=false;


/* =========================
حفظ
========================= */

function save(){

localStorage.setItem(
"legendGame",
JSON.stringify(state)
);

}


/* =========================
اختيار سؤال
========================= */

function getQuestions(){

if(state.category==="all"){

return QUESTIONS;

}

return QUESTIONS.filter(
q=>q.category===state.category
);

}


function newQuestion(){

locked=false;

selectedAnswer=null;

const list=getQuestions();

currentQuestion =
list[
Math.floor(
Math.random()*list.length
)
];

renderQuestion();

}


/* =========================
عرض السؤال
========================= */

function renderQuestion(){

document.getElementById(
"questionText"
).textContent =
currentQuestion.question;


document.getElementById(
"category"
).textContent =
CATEGORY_NAMES[
currentQuestion.category
];


const answers =
document.getElementById(
"answers"
);

answers.innerHTML="";


currentQuestion.answers
.forEach((answer,index)=>{

const button =
document.createElement("button");

button.className="answer";

button.textContent=answer;

button.onclick=()=>{

if(locked)return;

selectedAnswer=index;

document
.querySelectorAll(".answer")
.forEach(
b=>b.classList.remove("selected")
);

button.classList.add("selected");

};

answers.appendChild(button);

});


updateUI();

}


/* =========================
تحقق
========================= */

function checkAnswer(){

if(locked)return;

if(selectedAnswer===null){

toast("⚠️ اختر إجابة أولاً");

return;

}

locked=true;

const buttons =
document.querySelectorAll(
".answer"
);


buttons.forEach(
(button,index)=>{

button.disabled=true;

if(
index===
currentQuestion.correct
){

button.classList.add(
"correct"
);

}

if(
index===
selectedAnswer &&
index!==
currentQuestion.correct
){

button.classList.add(
"wrong"
);

}

});


state.answered++;


if(
selectedAnswer===
currentQuestion.correct
){

state.correct++;

state.streak++;

state.bestStreak =
Math.max(
state.bestStreak,
state.streak
);


const multiplier =
Math.min(
5,
1+
Math.floor(
state.streak/3
)
);


const points =
100*multiplier;


state.score+=points;

state.xp+=25;


/* كل 5 إجابات صحيحة = مرحلة */

state.stage =
Math.min(
100,
1+
Math.floor(
state.correct/5
)
);


toast(
"🎉 إجابة صحيحة +"+
points+
" نقطة"
);


correctSound();

confetti();

checkAchievements();

}else{

state.streak=0;

state.xp+=5;

toast(
"❌ إجابة خاطئة"
);

wrongSound();

}


save();

updateUI();


setTimeout(
newQuestion,
1200
);

}


/* =========================
حذف الاختيار
========================= */

function clearAnswer(){

if(locked)return;

selectedAnswer=null;

document
.querySelectorAll(".answer")
.forEach(
b=>b.classList.remove("selected")
);

}


/* =========================
تخطي
========================= */

locked

save();

مساعدة

function help(){

state.helps<=0 ||
locked
){

toast(
"💡 انتهت المساعدات"
);

}

const wrong =
Array.from(
document.querySelectorAll(".answer")
)

(b,i)=>

);

.sort(()=>Math.random()-.5)
.slice(0,2)
.forEach(
b=>{

}
);

updateUI();

toast(
"💡 تم حذف إجابتين خاطئتين"
);

}

/* =========================
الصوت
========================= */

function audioBeep(
frequency,
duration
){

if(!state.sound)return;

try{

const Audio =
window.AudioContext ||
window.webkitAudioContext;

if(!Audio)return;

const context =
window.gameAudio ||
(
window.gameAudio =
new Audio()
);

if(
context.state===
"suspended"
){

context.resume();

}

const oscillator =
context.createOscillator();

const gain =
context.createGain();

oscillator.connect(gain);

gain.connect(
context.destination
);

oscillator.frequency.value=
frequency;

gain.gain.value=.08;

oscillator.start();

setTimeout(
()=>{
oscillator.stop();
},
duration
);

}catch(e){}

}


function correctSound(){

audioBeep(700,120);

setTimeout(
()=>audioBeep(900,140),
100
);

}


function wrongSound(){

audioBeep(220,220);

}

:"🔇 تم إيقاف الصوت"
