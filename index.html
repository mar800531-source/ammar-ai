<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#031512">
<title>عمار الأسطورة 👑</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden
}

body{
font-family:Tahoma,Arial,sans-serif;
color:#f4fffc;
background:radial-gradient(circle at 50% -10%,#08775e,#06372d 38%,#02120f)
}

button{
font-family:inherit;
cursor:pointer
}

.app{
height:100dvh;
max-width:760px;
margin:auto;
padding:5px 7px;
display:flex;
flex-direction:column;
gap:5px;
overflow:hidden
}

.top{
height:52px;
display:grid;
grid-template-columns:52px 1fr 52px 52px 52px;
gap:5px;
align-items:center;
flex:none
}

.logo{
text-align:center;
font-size:clamp(19px,5vw,30px);
font-weight:900;
background:linear-gradient(90deg,#58e9a9,#68edf0);
-webkit-background-clip:text;
color:transparent;
white-space:nowrap
}

.scircle{
width:50px;
height:50px;
border-radius:50%;
background:#07372f;
border:2px solid #1b7662;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-size:10px
}

.scircle b{
color:#ffd84f;
font-size:16px
}

.sound{
font-size:21px;
background:#07372f;
color:#fff
}

.progress{
height:43px;
flex:none;
border:1px solid #1c6555;
border-radius:25px;
background:#062b24;
display:grid;
grid-template-columns:1fr 1.5fr 1fr;
align-items:center;
padding:5px 11px;
gap:7px;
font-size:12px;
font-weight:900
}

.barbox{
height:9px;
background:#12483e;
border-radius:20px;
overflow:hidden
}

#bar{
height:100%;
width:0;
background:linear-gradient(90deg,#5fe2a0,#5be8ef);
transition:.25s
}

.main{
min-height:0;
flex:1;
border:2px solid #15745e;
border-radius:25px;
background:#041f1af5;
padding:7px;
display:flex;
flex-direction:column;
gap:5px;
overflow:hidden
}

.cat{
height:20px;
text-align:center;
color:#55e6ac;
font-weight:900;
font-size:13px
}

.question{
height:76px;
flex:none;
border:1px solid #1a6353;
border-radius:18px;
background:#031b17;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:5px
}

#q{
font-size:clamp(17px,4.5vw,25px);
font-weight:900;
line-height:1.3
}

.answers{
min-height:0;
flex:1;
display:grid;
grid-template-columns:1fr 1fr;
grid-template-rows:1fr 1fr;
gap:6px
}

.answer{
min-height:0;
border-radius:17px;
background:#062c25;
border:1.5px solid #176252;
color:#fff;
font-size:clamp(13px,3.7vw,19px);
font-weight:900;
padding:5px;
transition:.15s;
overflow:hidden
}

.answer:active{
transform:scale(.97)
}

.answer:hover{
border-color:#49cda8;
background:#083b31
}

.answer.correct{
background:#075b42;
border-color:#69ff9a;
box-shadow:0 0 16px #4cff8a55
}

.answer.wrong{
background:#632c35;
border-color:#ff777f
}

.answer:disabled{
cursor:default
}

.option-number{
width:32px;
height:32px;
min-width:32px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#0b493d;
border:1px solid #2b806b;
color:#ffd84f;
font-size:15px;
font-weight:900
}

.option-text{
flex:1;
text-align:center;
line-height:1.25;
overflow-wrap:anywhere
}

.option-inner{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
gap:7px
}

.tools{
height:103px;
flex:none;
display:grid;
grid-template-columns:repeat(5,1fr);
grid-template-rows:1fr 1fr;
gap:4px
}

.tool{
border-radius:50%;
background:#062d26;
border:1.5px solid #176a58;
color:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-size:19px
}

.tool small{
font-size:9px;
font-weight:900;
white-space:nowrap
}

.tool:disabled{
opacity:.32
}

.stats{
height:40px;
flex:none;
border:1px solid #1b6354;
border-radius:22px;
display:grid;
grid-template-columns:repeat(3,1fr);
align-items:center;
background:#052820
}

.stats div{
text-align:center;
font-size:10px
}

.stats b{
display:block;
color:#ffd84f;
font-size:15px;
line-height:15px
}

.toast{
position:fixed;
z-index:100;
left:50%;
bottom:8px;
transform:translate(-50%,20px);
opacity:0;
background:#062b24;
border:1px solid #3c9c81;
border-radius:13px;
padding:7px 13px;
font-weight:900;
font-size:12px;
transition:.2s
}

.toast.show{
opacity:1;
transform:translate(-50%,0)
}

.modal{
position:fixed;
inset:0;
background:#000b;
display:none;
align-items:center;
justify-content:center;
padding:10px;
z-index:50
}

.modal.show{
display:flex
}

.box{
width:min(560px,100%);
max-height:88dvh;
overflow:auto;
background:#062820;
border:1px solid #2a7c67;
border-radius:20px;
padding:13px
}

.box h2{
margin:0 0 9px;
color:#61e9e2;
font-size:20px
}

.close{
float:left;
background:#173e35;
border:0;
color:#fff;
border-radius:9px;
padding:3px 8px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px
}

.mb{
background:#0a382f;
color:#fff;
border:1px solid #1c6654;
border-radius:12px;
padding:9px;
font-weight:bold
}

.active{
border-color:#67efa8!important;
background:#0b4c3c!important
}

.list{
display:grid;
gap:5px
}

.row{
display:flex;
justify-content:space-between;
background:#0a342c;
border:1px solid #195a4c;
border-radius:11px;
padding:8px;
font-size:12px
}

.badges{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px
}

.badge{
padding:9px;
border-radius:11px;
background:#0a342c;
border:1px solid #195a4c;
font-size:11px
}

.badge b{
display:block;
color:#ffd84f
}

.confetti{
position:fixed;
top:-10px;
width:7px;
height:12px;
z-index:80;
animation:fall .8s linear forwards
}

@keyframes fall{
to{
transform:translateY(105vh) rotate(600deg);
opacity:0
}
}

@media(max-height:600px){

.top{
height:43px;
grid-template-columns:44px 1fr 44px 44px 44px
}

.scircle{
width:42px;
height:42px
}

.progress{
height:37px
}

.question{
height:62px
}

.tools{
height:82px
}

.stats{
height:34px
}

.option-number{
width:27px;
height:27px;
min-width:27px;
font-size:13px
}

}
</style>
</head>

<body>

<div class="app">

<header class="top">

<div class="scircle">
🏆
<b id="score">0</b>
</div>

<div class="logo">
👑 عمار الأسطورة
</div>

<div class="scircle">
🔥
<b id="streak">0</b>
</div>

<div class="scircle">
⭐
<b id="xp">0</b>
</div>

<button class="scircle sound" id="sound" onclick="toggleSound()">
🔊
</button>

</header>

<div class="progress">

<span id="stage">
المرحلة 1/100
</span>

<div class="barbox">
<div id="bar"></div>
</div>

<span id="qn">
السؤال 1/3
</span>

</div>

<main class="main">

<div class="cat" id="cat">
📚 ثقافة عامة
</div>

<div class="question">
<div id="q">
اضغط للبدء
</div>
</div>

<div class="answers" id="answers"></div>

<div class="tools">

<button class="tool" id="help" onclick="help()">
💡
<small>مساعدة <span id="hc">3</span>⭐</small>
</button>

<button class="tool" id="skip" onclick="skip()">
⏭️
<small>تخطي <span id="sc">5</span>⭐</small>
</button>

<button class="tool" onclick="randomQ()">
🎲
<small>سؤال جديد</small>
</button>

<button class="tool" id="reveal" onclick="reveal()">
👁️
<small>كشف <span id="rc">8</span>⭐</small>
</button>

<button class="tool" onclick="categories()">
🗂️
<small>الفئات</small>
</button>

<button class="tool" onclick="stats()">
📊
<small>إحصائيات</small>
</button>

<button class="tool" onclick="badges()">
🎁
<small>مكافآتي</small>
</button>

<button class="tool" onclick="leaderboard()">
🏆
<small>الصدارة</small>
</button>

<button class="tool" onclick="mapGame()">
🗺️
<small>الخريطة</small>
</button>

<button class="tool" onclick="settings()">
⚙️
<small>الإعدادات</small>
</button>

</div>

<div class="stats">

<div>
<b id="correct">0</b>
✅ صحيح
</div>

<div>
<b id="acc">0%</b>
🎯 دقة
</div>

<div>
<b>+2</b>
🏆 الصحيح
</div>

</div>

</main>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="modal">

<div class="box">

<button class="close" onclick="closeM()">✕</button>

<div id="mc"></div>

</div>
</div>

<script>
"use strict";

/* =====================================================
   بنك الأسئلة المحلي
   لا يحتاج إلى الإنترنت
===================================================== */

const Q=[

{
c:"general",
q:"عاصمة اليابان؟",
a:["طوكيو","بكين","سيول","بانكوك"],
ok:0
},

{
c:"general",
q:"أكبر محيط في العالم؟",
a:["الهادئ","الأطلسي","الهندي","المتجمد الشمالي"],
ok:0
},

{
c:"general",
q:"الكوكب الأحمر؟",
a:["المريخ","الزهرة","المشتري","عطارد"],
ok:0
},

{
c:"general",
q:"عدد أيام الأسبوع؟",
a:["7","5","6","8"],
ok:0
},

{
c:"general",
q:"عدد أشهر السنة؟",
a:["12","10","11","13"],
ok:0
},

{
c:"general",
q:"أكبر قارة؟",
a:["آسيا","أفريقيا","أوروبا","أستراليا"],
ok:0
},

{
c:"general",
q:"عاصمة فرنسا؟",
a:["باريس","روما","برلين","مدريد"],
ok:0
},

{
c:"general",
q:"أكبر حيوان معروف؟",
a:["الحوت الأزرق","الفيل","الزرافة","الدب"],
ok:0
},

{
c:"general",
q:"أسرع حيوان بري؟",
a:["الفهد","الأسد","الحصان","الذئب"],
ok:0
},

{
c:"general",
q:"عاصمة مصر؟",
a:["القاهرة","الإسكندرية","الجيزة","الأقصر"],
ok:0
},

{
c:"science",
q:"رمز الماء الكيميائي؟",
a:["H2O","CO2","O2","NaCl"],
ok:0
},

{
c:"science",
q:"الجسيم ذو الشحنة السالبة؟",
a:["الإلكترون","البروتون","النيوترون","النواة"],
ok:0
},

{
c:"science",
q:"وحدة قياس القوة؟",
a:["نيوتن","واط","فولت","أمبير"],
ok:0
},

{
c:"science",
q:"أقرب كوكب إلى الشمس؟",
a:["عطارد","الزهرة","الأرض","المريخ"],
ok:0
},

{
c:"science",
q:"المادة الوراثية؟",
a:["DNA","ATP","الماء","الكالسيوم"],
ok:0
},

{
c:"civilization",
q:"أين تقع أهرامات الجيزة؟",
a:["مصر","العراق","اليونان","المكسيك"],
ok:0
},

{
c:"civilization",
q:"عاصمة الدولة العباسية؟",
a:["بغداد","دمشق","القاهرة","قرطبة"],
ok:0
},

{
c:"civilization",
q:"أين تقع البتراء؟",
a:["الأردن","مصر","العراق","تونس"],
ok:0
},

{
c:"civilization",
q:"الموقع اليمني المرتبط بمملكة سبأ؟",
a:["مأرب","الإسكندرية","قرطاج","أثينا"],
ok:0
},

{
c:"civilization",
q:"السد التاريخي الشهير في اليمن؟",
a:["سد مأرب","سد أسوان","سد الموصل","سد هوفر"],
ok:0
},

{
c:"geo",
q:"أعلى جبل فوق سطح البحر؟",
a:["إيفرست","كليمنجارو","إلبروس","الألب"],
ok:0
},

{
c:"geo",
q:"أطول نهر في أفريقيا؟",
a:["النيل","الكونغو","النيجر","السنغال"],
ok:0
},

{
c:"geo",
q:"أكبر دولة مساحة؟",
a:["روسيا","كندا","الصين","الولايات المتحدة"],
ok:0
},

{
c:"geo",
q:"عاصمة اليمن؟",
a:["صنعاء","عدن","تعز","الحديدة"],
ok:0
},

{
c:"geo",
q:"البحر بين الجزيرة العربية وأفريقيا؟",
a:["الأحمر","الأسود","العرب","قزوين"],
ok:0
}

];

/* =====================================================
   الفئات
===================================================== */

const N={
all:"🌍 الكل",
general:"📚 ثقافة عامة",
science:"🔬 علمية",
civilization:"🏛️ حضارية",
geo:"🌍 جغرافية"
};

/* =====================================================
   الحالة الافتراضية
===================================================== */

const DEFAULT_STATE={
score:0,
xp:0,
correct:0,
answered:0,
streak:0,
best:0,
skip:5,
help:3,
reveal:8,
sound:true,
vib:true,
fx:true,
cat:"all",
name:"اللاعب",
pos:0,
order:[],
ach:[]
};

let st=getState();
let cur=null;
let locked=false;
let timer=null;
let toastTimer=null;

/* =====================================================
   اختصار العناصر
===================================================== */

const $=id=>document.getElementById(id);

/* =====================================================
   قراءة الحفظ
===================================================== */

function getState(){

try{

const raw=localStorage.getItem("AMMAR300");

if(!raw)
return {...DEFAULT_STATE};

const saved=JSON.parse(raw);

if(!saved || typeof saved!=="object")
return {...DEFAULT_STATE};

const s={
...DEFAULT_STATE,
...saved
};

if(!Array.isArray(s.order))
s.order=[];

if(!Array.isArray(s.ach))
s.ach=[];

if(!N[s.cat])
s.cat="all";

if(!Number.isInteger(s.pos)||s.pos<0)
s.pos=0;

return s;

}catch(e){

try{
localStorage.removeItem("AMMAR300");
}catch(_){}

return {...DEFAULT_STATE};

}

}

/* =====================================================
   حفظ
===================================================== */

function save(){

try{

localStorage.setItem(
"AMMAR300",
JSON.stringify(st)
);

}catch(e){}

}

/* =====================================================
   خلط
===================================================== */

function shuffle(a){

for(let i=a.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[a[i],a[j]]=[
a[j],a[i]
];

}

return a;

}

/* =====================================================
   تجهيز السؤال
   تغيير مكان الإجابة الصحيحة
===================================================== */

function prepareQuestion(q){

if(
!q ||
typeof q.q!=="string" ||
!Array.isArray(q.a) ||
q.a.length!==4 ||
!Number.isInteger(q.ok) ||
q.ok<0 ||
q.ok>3
){
return null;
}

const arr=q.a.map(
(text,index)=>({
text:String(text),
correct:index===q.ok
})
);

shuffle(arr);

const newCorrect=
arr.findIndex(x=>x.correct);

if(newCorrect<0)
return null;

return{

c:N[q.c]?q.c:"general",

q:q.q,

a:arr.map(x=>x.text),

ok:newCorrect

};

}

/* =====================================================
   بناء ترتيب الأسئلة
===================================================== */

function rebuild(){

let ids=[];

for(let i=0;i<Q.length;i++){

if(
st.cat==="all" ||
Q[i].c===st.cat
){

ids.push(i);

}

}

if(ids.length===0){

st.cat="all";

for(let i=0;i<Q.length;i++)
ids.push(i);

}

shuffle(ids);

st.order=ids;
st.pos=0;

save();

}

/* =====================================================
   حساب المرحلة
===================================================== */

function stage(){

return Math.min(
100,
Math.floor(st.answered/3)+1
);

}

function qi(){

return(st.answered%3)+1;

}

/* =====================================================
   تحميل سؤال محلي
   لا يوجد fetch
   لا يوجد انتظار إنترنت
===================================================== */

function load(){

if(timer)
clearTimeout(timer);

if(
!Array.isArray(st.order) ||
st.order.length===0
){

rebuild();

}

if(
st.pos>=st.order.length
){

rebuild();

}

const index=st.order[st.pos];

if(
!Number.isInteger(index) ||
!Q[index]
){

rebuild();

}

const original=
Q[st.order[st.pos]];

const prepared=
prepareQuestion(original);

if(!prepared){

rebuild();

return load();

}

cur=prepared;

locked=false;

render();

return true;

}

/* =====================================================
   رسم السؤال
===================================================== */

function render(){

if(!cur)
return;

$("q").textContent=
cur.q;

$("cat").textContent=
(N[cur.c]||N.general)
+
" • "
+
(
stage()<=25
?"مبتدئ"
:
stage()<=50
?"متوسط"
:
stage()<=75
?"متقدم"
:
"خبير"
);

$("answers").innerHTML="";

const labels=[
"①",
"②",
"③",
"④"
];

cur.a.forEach((text,i)=>{

const button=
document.createElement("button");

button.type="button";

button.className="answer";

button.innerHTML=`

<div class="option-inner">

<span class="option-number">
${labels[i]}
</span>

<span class="option-text">
${escapeHTML(text)}
</span>

</div>

`;

button.onclick=()=>{
answer(i,button);
};

$("answers")
.appendChild(button);

});

ui();

}

/* =====================================================
   حماية النص
===================================================== */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

/* =====================================================
   اختيار الإجابة
===================================================== */

function answer(i,button){

if(locked||!cur)
return;

locked=true;

document
.querySelectorAll(".answer")
.forEach(x=>{
x.disabled=true;
});

st.answered++;

if(i===cur.ok){

button.classList.add("correct");

st.correct++;
st.score+=2;
st.xp+=10;
st.streak++;

st.best=
Math.max(
st.best,
st.streak
);

toast("✅ صحيح +2");

beep(750,70);

vib(30);

fx();

ach();

}else{

button.classList.add("wrong");

const buttons=
document.querySelectorAll(".answer");

if(buttons[cur.ok])
buttons[cur.ok]
.classList.add("correct");

st.streak=0;
st.xp+=2;

toast("❌ خطأ");

beep(180,170);

vib(70);

}

save();
ui();

timer=setTimeout(()=>{

st.pos++;

if(
st.pos>=st.order.length
){

rebuild();

}

save();

load();

},650);

}

/* =====================================================
   تخطي
===================================================== */

function skip(){

if(locked)
return;

if(st.skip<1){

toast("⏭️ لا يوجد تخطي");

return;

}

st.skip--;

st.pos++;

if(
st.pos>=st.order.length
){

rebuild();

}

save();

load();

toast("⏭️ تم التخطي");

}

/* =====================================================
   مساعدة
===================================================== */

function help(){

if(locked)
return;

if(st.help<1){

toast("💡 انتهت المساعدة");

return;

}

st.help--;

const wrong=[
...document.querySelectorAll(".answer")
]
.map((button,index)=>({
button,
index
}))
.filter(

toast("👁️ انتهى الكشف");

}

st.reveal--;

const buttons=
document.querySelectorAll(".answer");

if(buttons[cur.ok])
buttons[cur.ok]
.classList.add("correct");

save();
ui();

toast("👁️ تم كشف الصحيح");

}
