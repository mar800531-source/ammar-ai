<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#031c18">
<title>عمار الأسطورة 👑</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  color:#effffb;
  background:
    radial-gradient(circle at 50% -20%,#08765d,#06352d 42%,#021713 100%);
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
  color:white;
}

.app{
  width:100%;
  max-width:650px;
  height:100dvh;
  margin:auto;
  padding:
    max(6px,env(safe-area-inset-top))
    8px
    max(6px,env(safe-area-inset-bottom));

  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ================= HEADER ================= */

.top{
  flex:0 0 auto;
  height:64px;

  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:5px;
}

.logo{
  text-align:center;
  font-size:clamp(21px,6vw,32px);
  font-weight:900;

  background:linear-gradient(
    90deg,
    #55e6a5,
    #68e9ed
  );

  -webkit-background-clip:text;
  color:transparent;
}

.logo small{
  display:block;
  font-size:15px;
  color:#ffd94c;
  -webkit-text-fill-color:#ffd94c;
}

.headerSide{
  display:flex;
  gap:6px;
  align-items:center;
}

.headerSide.right{
  justify-content:flex-start;
}

.headerSide.left{
  justify-content:flex-end;
}

.pill{
  width:55px;
  height:55px;

  border-radius:50%;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  background:#062d26;
  border:1px solid #287c67;

  box-shadow:
    inset 0 0 12px #0b4b3c,
    0 0 8px #00b88922;

  font-size:21px;
}

.pill b{
  font-size:14px;
  color:white;
}

/* ================= PROGRESS ================= */

.progress{
  flex:0 0 auto;

  height:57px;

  border-radius:28px;

  background:#062c25;
  border:1px solid #24705e;

  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;

  gap:10px;

  padding:8px 14px;

  margin-bottom:7px;
}

.progressText{
  font-size:15px;
  font-weight:bold;
  white-space:nowrap;
}

.bar{
  height:10px;
  border-radius:20px;
  background:#174b40;
  overflow:hidden;
}

.bar span{
  display:block;
  width:0;
  height:100%;

  background:linear-gradient(
    90deg,
    #54df9d,
    #66ecef
  );

  transition:.3s;
}

/* ================= MAIN ================= */

.game{
  flex:1;
  min-height:0;

  display:flex;
  flex-direction:column;

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      #062c25ee,
      #031d18ee
    );

  border:1px solid #1d806a;

  padding:10px;

  overflow:hidden;
}

/* ================= CATEGORY ================= */

.category{
  flex:0 0 auto;

  text-align:center;

  color:#58e5a5;
  font-size:18px;
  font-weight:900;

  margin:2px 0 3px;
}

/* ================= QUESTION ================= */

.questionBox{
  flex:0 0 auto;

  height:105px;

  border-radius:22px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:10px;

  background:#031f1a;

  border:1px solid #17614f;

  box-shadow:inset 0 0 25px #00100c55;
}

.question{
  font-size:clamp(20px,5.2vw,29px);
  line-height:1.35;
  font-weight:900;
}

/* ================= ANSWERS ================= */

.answers{
  flex:1;
  min-height:0;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-top:8px;
}

.answer{
  min-height:0;

  border-radius:22px;

  background:
    radial-gradient(
      circle,
      #0b382f,
      #05261f
    );

  border:1px solid #1b6352;

  font-size:clamp(17px,4.5vw,22px);
  font-weight:900;

  padding:8px;

  transition:.15s;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;
}

.answer:active{
  transform:scale(.96);
}

.answer.selected{
  border:2px solid #69ef9b;
  box-shadow:
    0 0 15px #69ef9b66;
}

.answer.correct{
  background:#086342;
  border-color:#62f09b;
  box-shadow:0 0 20px #49ef9277;
}

.answer.wrong{
  background:#612b32;
  border-color:#ff747d;
}

/* ================= TOOLS ================= */

.tools{
  flex:0 0 auto;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:6px;

  margin-top:8px;
}

.tool{
  height:58px;

  border-radius:30px;

  background:#062c26;

  border:1px solid #257762;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  font-size:20px;
}

.tool span{
  font-size:12px;
  margin-top:1px;
}

.tool:active{
  transform:scale(.94);
}

.tool:disabled{
  opacity:.35;
}

/* ================= BOTTOM ================= */

.bottom{
  flex:0 0 auto;

  height:51px;

  display:grid;
  grid-template-columns:1fr 1fr 1fr;

  margin-top:7px;

  border-radius:25px;

  background:#062d27;

  border:1px solid #1d6958;
}

.stat{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  font-size:12px;
}

.stat b{
  color:#ffd84a;
  font-size:19px;
}

.stat:not(:last-child){
  border-left:1px solid #155144;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;

  background:#000b;

  display:none;
  align-items:center;
  justify-content:center;

  padding:15px;

  z-index:1000;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(500px,100%);
  max-height:85dvh;

  overflow:auto;

  border-radius:25px;

  background:#06271f;

  border:1px solid #299071;

  padding:18px;
}

.modalBox h2{
  margin-top:0;
  color:#59e8e7;
  text-align:center;
}

.close{
  float:left;

  width:38px;
  height:38px;

  border-radius:50%;

  background:#173b34;
}

.list{
  display:grid;
  gap:8px;
}

.row{
  padding:11px;

  border-radius:15px;

  background:#0a342b;

  border:1px solid #19584a;

  display:flex;
  justify-content:space-between;
}

.row.me{
  border-color:#ffd94d;
}

.categories{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.cat{
  padding:15px 8px;
  border-radius:17px;

  background:#0b372e;
  border:1px solid #216b59;

  font-weight:bold;
}

.cat.active{
  background:#086248;
  border-color:#61ed9d;
}

.badges{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.badge{
  padding:12px;
  border-radius:15px;

  background:#0b342c;
  border:1px solid #1b5a4b;
}

.badge.lock{
  opacity:.35;
}

.setting{
  width:100%;

  padding:14px;

  margin:5px 0;

  border-radius:16px;

  background:#0b382f;

  border:1px solid #1c6452;

  text-align:right;
}

.danger{
  background:#59272c;
  border-color:#a34b52;
}

/* ================= TOAST ================= */

#toast{
  position:fixed;

  bottom:15px;
  left:50%;

  transform:translate(-50%,30px);

  opacity:0;

  padding:11px 18px;

  border-radius:18px;

  background:#062d26;

  border:1px solid #39a887;

  z-index:2000;

  transition:.2s;

  font-weight:bold;

  white-space:nowrap;
}

#toast.show{
  transform:translate(-50%,0);
  opacity:1;
}

/* ================= EFFECT ================= */

.confetti{
  position:fixed;

  top:-15px;

  width:7px;
  height:13px;

  z-index:1500;

  animation:fall 1s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(105vh) rotate(720deg);
    opacity:0;
  }
}

/* ================= SMALL SCREENS ================= */

@media(max-height:650px){

  .top{
    height:52px;
  }

  .pill{
    width:45px;
    height:45px;
    font-size:17px;
  }

  .logo{
    font-size:21px;
  }

  .progress{
    height:48px;
  }

  .questionBox{
    height:85px;
  }

  .tool{
    height:47px;
    font-size:17px;
  }

  .tool span{
    font-size:10px;
  }

  .bottom{
    height:43px;
  }

  .stat b{
    font-size:16px;
  }
}

@media(max-width:380px){

  .app{
    padding-left:5px;
    padding-right:5px;
  }

  .game{
    padding:7px;
  }

  .questionBox{
    height:80px;
  }

  .answer{
    font-size:16px;
  }

  .tool{
    height:45px;
  }
}
</style>
</head>

class="tool"

</button>


<button
class="tool"

<span>مكافآتي</span>

</button>


<button
class="tool"
onclick="showLeaderboard()">

🏆
<span>الصدارة</span>

</button>


<button
class="tool"
onclick="showSettings()">

⚙️
<span>الإعدادات</span>

</button>

</div>


<!-- BOTTOM STATS -->

<div class="bottom">

<div class="stat">
<b id="correct">0</b>
<span>✅ صحيح</span>
</div>

<div class="stat">
<b>+2</b>
<span>⭐ نقاط السؤال</span>
</div>

<div class="stat">
<b id="stageReward">0</b>
<span>🎁 مكافأة المرحلة</span>
</div>

</div>

</main>

</div>


<!-- MODAL -->

<div
id="modal"
class="modal">

<div class="modalBox">

<button
class="close"
onclick="closeModal()">
✕
</button>

<div id="modalContent"></div>

</div>

</div>


<div id="toast"></div>
