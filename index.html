<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عمار بن ياسر | مطور AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 30px; max-width: 450px; width: 100%; text-align: center; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); }
        .avatar { width: 90px; height: 90px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 20px; }
        h1 { font-size: 1.6rem; color: #ffffff; margin-bottom: 8px; }
        .badge { display: inline-block; background: rgba(99, 102, 241, 0.2); color: #818cf8; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; margin-bottom: 16px; }
        p { color: #94a3b8; line-height: 1.6; font-size: 0.95rem; margin-bottom: 24px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">👋</div>
        <h1>مرحباً، أنا عمار بن ياسر</h1>
        <span class="badge">مهتم بالذكاء الاصطناعي AI</span>
        <p>أعمل على تطوير التطبيقات والمشاريع البرمجية. أطمح دائماً لبناء أدوات تُسهّل حياتنا.</p>
    </div>
</body>
</html>
