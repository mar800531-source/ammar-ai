<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#071b16">
<title>تحدي الكلمات الأسطوري</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Cairo,sans-serif;
}

body{
    background:
        radial-gradient(circle at 20% 10%,rgba(16,185,129,.22),transparent 30%),
        radial-gradient(circle at 90% 90%,rgba(6,182,212,.18),transparent 30%),
        linear-gradient(135deg,#02140f,#05271e,#011711);
    color:white;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    width:350px;
    height:350px;
    background:#10b981;
    filter:blur(150px);
    opacity:.13;
    border-radius:50%;
    top:-100px;
    left:-100px;
    pointer-events:none;
}

body:after{
    content:"";
    position:fixed;
    width:300px;
    height:300px;
    background:#06b6d4;
    filter:blur(150px);
    opacity:.10;
    right:-100px;
    bottom:-100px;
    pointer-events:none;
}

button{
    font-family:inherit;
}

.app{
    width:min(650px,94%);
    margin:auto;
    padding:16px 0 30px;
    position:relative;
    z-index:2;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
}

.brand{
    font-weight:900;
    font-size:20px;
    color:#6ee7b7;
    text-shadow:0 0 18px rgba(16,185,129,.3);
}

.stats{
    display:flex;
    gap:7px;
}

.stat{
    padding:7px 10px;
    border-radius:14px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    font-size:12px;
    font-weight:800;
}

.stat span{
    color:#6ee7b7;
}

.progress-box{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.1);
    padding:11px;
    border-radius:18px;
    margin-bottom:12px;
}

.progress-head{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#cbd5e1;
    margin-bottom:7px;
}

.progress{
    height:8px;
    background:rgba(255,255,255,.08);
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#10b981,#34d399,#67e8f9);
    border-radius:20px;
    transition:.5s;
    box-shadow:0 0 12px rgba(52,211,153,.5);
}

.card{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.13);
    border-radius:30px;
    padding:18px;
    box-shadow:
        0 25px 70px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(18px);
}

.title{
    text-align:center;
    font-size:28px;
    font-weight:900;
    background:linear-gradient(135deg,#34d399,#a7f3d0,#67e8f9);
    -webkit-background-clip:text;
    color:transparent;
    margin:0;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    font-size:12px;
    margin-bottom:16px;
}

.question{
    background:
        linear-gradient(135deg,rgba(16,185,129,.10),rgba(0,0,0,.22));
    border:1px solid rgba(52,211,153,.12);
    border-right:4px solid #10b981;
    padding:18px 15px;
    border-radius:18px;
    font-size:17px;
    font-weight:800;
    line-height:1.8;
    text-align:center;
    min-height:88px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.category{
    text-align:center;
    color:#67e8f9;
    font-size:11px;
    font-weight:800;
    margin:10px 0;
}

.answer-slots{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:7px;
    min-height:55px;
    margin:16px 0;
}

.slot{
    width:42px;
    height:46px;
    border-radius:11px;
    border:2px dashed rgba(255,255,255,.25);
    background:rgba(255,255,255,.05);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:21px;
    font-weight:900;
    color:#6ee7b7;
    transition:.2s;
}

.slot.filled{
    border-style:solid;
    border-color:#34d399;
    background:rgba(16,185,129,.15);
    transform:translateY(-2px);
}

.letters{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin:15px 0;
}

.letter{
    width:49px;
    height:49px;
    border:0;
    border-radius:14px;
    background:linear-gradient(145deg,#059669,#047857);
    color:#fff;
    font-size:20px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 7px 18px rgba(5,150,105,.27);
    transition:.15s;
}

.letter:active{
    transform:scale(.88);
}

.letter.used{
    opacity:.18;
    transform:scale(.9);
    pointer-events:none;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
}

.btn{
    min-height:48px;
    border:0;
    border-radius:15px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.btn:active{
    transform:scale(.96);
}

.check{
    background:linear-gradient(135deg,#10b981,#059669);
    color:white;
}

.clear{
    background:rgba(239,68,68,.14);
    color:#fca5a5;
    border:1px solid rgba(239,68,68,.25);
}

.tools{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:7px;
    margin-top:9px;
}

.tool{
    min-height:44px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    background:rgba(255,255,255,.06);
    color:#e2e8f0;
    font-weight:800;
    cursor:pointer;
}

.tool.help{
    color:#fde68a;
    border-color:rgba(250,204,21,.18);
}

.tool.skip{
    color:#fca5a5;
    border-color:rgba(239,68,68,.18);
}

.tool.map{
    color:#67e8f9;
    border-color:rgba(34,211,238,.18);
}

.message{
    min-height:28px;
    text-align:center;
    font-weight:900;
    font-size:14px;
    margin-top:12px;
}

.footer{
    text-align:center;
    color:#64748b;
    font-size:10px;
    margin-top:15px;
}

.footer b{
    color:#34d399;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(10px);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:20;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(600px,100%);
    max-height:88vh;
    overflow:auto;
    background:#071b16;
    border:1px solid rgba(255,255,255,.12);
    border-radius:25px;
    padding:18px;
    box-shadow:0 30px 90px rgba(0,0,0,.7);
}

.modal-title{
    text-align:center;
    font-size:22px;
    font-weight:900;
    color:#6ee7b7;
    margin-bottom:14px;
}

.map-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.level-btn{
    aspect-ratio:1;
    border:1px solid rgba(255,255,255,.1);
    border-radius:13px;
    background:rgba(255,255,255,.05);
    color:#cbd5e1;
    font-weight:900;
    cursor:pointer;
}

.level-btn.open{
    background:linear-gradient(135deg,#047857,#059669);
    color:white;
}

.level-btn.current{
    outline:3px solid #67e8f9;
}

.level-btn.done{
    background:linear-gradient(135deg,#065f46,#10b981);
    color:#d1fae5;
}

.level-btn.locked{
    opacity:.3;
    cursor:not-allowed;
}

.close{
    width:100%;
    margin-top:14px;
    min-height:46px;
    border:0;
    border-radius:14px;
    background:#102a23;
    color:#cbd5e1;
    font-weight:900;
}

.win{
    text-align:center;
}

.win .trophy{
    font-size:70px;
    animation:bounce 1s infinite alternate;
}

@keyframes bounce{
    to{transform:translateY(-10px) rotate(3deg)}
}

.win h2{
    color:#6ee7b7;
    font-size:28px;
}

.win p{
    color:#cbd5e1;
}

.shake{
    animation:shake .35s;
}

@keyframes shake{
    20%{transform:translateX(8px)}
    40%{transform:translateX(-8px)}
    60%{transform:translateX(6px)}
    80%{transform:translateX(-6px)}
}

.pop{
    animation:pop .3s;
}

@keyframes pop{
    50%{transform:scale(1.04)}
}

@media(max-width:400px){
    .slot{
        width:36px;
        height:41px;
        font-size:18px;
    }

    .letter{
        width:44px;
        height:44px;
    }

    .question{
        font-size:15px;
    }

    .map-grid{
        gap:6px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="topbar">
        <div class="brand">⚡ تحدي الكلمات</div>

        <div class="stats">
            <div class="stat">⭐ <span id="score">0</span></div>
            <div class="stat">🏆
