<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد عمار الذكي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .chat-container { background: #1e293b; border: 1px solid #334155; border-radius: 16px; width: 100%; max-width: 480px; height: 85vh; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); overflow: hidden; }
        .chat-header { background: #0f172a; padding: 15px 20px; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .chat-header h1 { font-size: 1.1rem; color: #ffffff; }
        .chat-header span { font-size: 0.75rem; color: #10b981; display: block; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.5; word-wrap: break-word; }
        .message.bot { background: #334155; color: #f8fafc; align-self: flex-start; border-bottom-right-radius: 4px; }
        .message.user { background: #6366f1; color: #fff; align-self: flex-end; border-bottom-left-radius: 4px; }
        .chat-input-area { padding: 12px 15px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; color: #fff; outline: none; }
        .chat-input-area button { background: #6366f1; color: #fff; border: none; border-radius: 8px; padding: 0 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar">🤖</div>
            <div><h1>مساعد عمار الذكي</h1><span>● متصل</span></div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">أهلاً يا عمار، أنا مساعدك الذكي الذي صممه سامي أصلاوي. كيف أساعدك اليوم؟</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="اكتب سؤالك..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6LRoyz9a2gQYUQ0-L71DUHnspsC_7zQFz0mMziW6YoydA";

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatMessages = document.getElementById('chatMessages');
            const messageText = inputField.value.trim();
            if(!messageText) return;

            // إضافة رسالة المستخدم
            chatMessages.innerHTML += `<div class="message user">${messageText}</div>`;
            inputField.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // استخدام الموديل الأحدث للتعامل مع المفتاح
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "أنت مساعد ذكي مطور من قبل سامي أصلاوي. أجب باحترافية على السؤال التالي: " + messageText }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates.length > 0) {
                    const reply = data.candidates[0].content.parts[0].text;
                    chatMessages.innerHTML += `<div class="message bot">${reply}</div>`;
                } else {
                    chatMessages.innerHTML += `<div class="message bot">عذراً، لم أستطع معالجة الرد، حاول مرة أخرى.</div>`;
                }
            } catch(e) {
                chatMessages.innerHTML += `<div class="message bot">عذراً، حدث خطأ في الاتصال بالخادم.</div>`;
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
