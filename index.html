['geo','ما عاصمة سلطنة عُمان؟',['مسقط','صلالة','نزوى','صحار']],
['geo','ما عاصمة قطر؟',['الدوحة','الريان','الخور','الوكرة']],
['geo','ما عاصمة البحرين؟',['المنامة','المحرق','الرفاع','حمد']],
['geo','ما عاصمة الكويت؟',['الكويت','حولي','الفروانية','الجهراء']]
];
BANK.forEach(x=>add(x[0],x[1],x[2],0));
const base=questions.slice();let n=0;
while(questions.length<300){const b=base[n++%base.length];questions.push({id:questions.length+1,cat:b.cat,q:`${b.q} — تحدي ${Math.floor(questions.length/base.length)+1}`,a:[...b.a],c:b.c});}

const DEFAULT={name:'اللاعب',score:0,xp:0,stage:1,correct:0,answered:0,streak:0,best:0,skips:5,helps:3,reveals:8,sound:true,vibration:true,night:true,category:'all',used:[],legendary500:false,legendary1000:false,mode:'classic',roundWins:0,perfectRounds:0,dailyKey:'',dailyBest:0};
function load(){try{return {...DEFAULT,...JSON.parse(localStorage.getItem('ammarLegendV3')||'null')}}catch(e){return {...DEFAULT}}}
let state=load(),current=null,selected=null,locked=false,timeLeft=30,timerInterval=null;
const QUESTION_TIME=30,$=id=>document.getElementById(id);
const MODES={classic:{name:'الجولة الكلاسيكية',time:30,mult:1},speed:{name:'جولة السرعة',time:15,mult:2},hard:{name:'الجولة الصعبة',time:20,mult:3},survival:{name:'جولة البقاء',time:12,mult:4}};
function modeInfo(){return MODES[state.mode]||MODES.classic}
function modePoints(){return modeInfo().mult}
function setMode(m){if(!MODES[m])return;state.mode=m;state.used=[];save();closeModal();nextQuestion();toast('🎮 '+modeInfo().name);update()}
function openModes(){let h='<h2>🎮 خيارات الجولات</h2><p style="color:#9ec1ba;font-size:12px">اختر جولة تناسبك. النقاط الأساسية لا تُمنح إلا بعد سلسلة صحيحة، والوصول إلى 1000 نادر جدًا.</p><div class="menuGrid">';for(const[k,v]of Object.entries(MODES)){h+=`<button class="menuBtn" onclick="setMode('${k}')">${v.name}<br><small>⏱️ ${v.time}ث • مضاعف ×${v.mult}</small></button>`}h+='</div><div class="row"><b>🏅 التحدي اليومي</b><button class="menuBtn" onclick="dailyChallenge()">دخول</button></div>';openModal(h)}
function dailyChallenge(){state.mode='hard';state.category='all';state.used=[];state.dailyKey=new Date().toISOString().slice(0,10);save();closeModal();nextQuestion();toast('🔥 بدأ التحدي اليومي')}

function save(){try{localStorage.setItem('ammarLegendV3',JSON.stringify(state))}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(){let p=state.category==='all'?questions:questions.filter(q=>q.cat===state.category);return p.length?p:questions}
function nextQuestion(){clearInterval(timerInterval);locked=false;selected=null;let p=pool(),avail=p.filter(q=>!state.used.includes(q.id));if(!avail.length){state.used=[];avail=p}current=avail[Math.floor(Math.random()*avail.length)];state.used.push(current.id);save();render()}
function render(){if(!current)return;$('questionText').textContent=current.q;$('category').textContent=C[current.cat];$('catTop').textContent=C[current.cat];let opts=shuffle(current.a.map((text,i)=>({text,ok:i===current.c})));$('answers').innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.className='answer';b.textContent=o.text;b.dataset.ok=o.ok?'1':'0';b.onclick=()=>{if(locked||b.disabled)return;selected=o.ok;document.querySelectorAll('.answer').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('answers').appendChild(b)});update();startTimer()}
function startTimer(){clearInterval(timerInterval);timeLeft=modeInfo().time;updateTimer();timerInterval=setInterval(()=>{if(locked)return;timeLeft--;updateTimer();if(timeLeft<=10&&timeLeft>0)beep(520);if(timeLeft<=0){clearInterval(timerInterval);timeUp()}},1000)}
function updateTimer(){const n=$('timerNum'),b=$('timerBar'),box=$('timerBox');n.textContent=timeLeft;b.style.width=Math.max(0,timeLeft/modeInfo().time*100)+'%';box.classList.toggle('warning',timeLeft<=10&&timeLeft>5);box.classList.toggle('danger',timeLeft<=5)}
function submitAnswer(){if(locked)return;if(selected===null){toast('⚠️ اختر إجابة');return}locked=true;clearInterval(timerInterval);document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.dataset.ok==='1')b.classList.add('correct');if(b.classList.contains('selected')&&b.dataset.ok!=='1')b.classList.add('wrong')});state.answered++;if(selected){state.correct++;state.streak++;state.best=Math.max(state.best,state.streak);let earned=0,msg='✅ صحيحة';const bonuses={5:[2,'🔥 سلسلة 5! +2'],10:[5,'🔥 سلسلة 10! +5'],20:[10,'🔥 سلسلة 20! +10'],30:[20,'👑 سلسلة 30! +20'],50:[50,'💎 سلسلة 50! +50'],100:[100,'👑 سلسلة 100! +100']};if(state.streak>=3)earned=modePoints();if(bonuses[state.streak])earned+=bonuses[state.streak][0];if(state.streak<3)msg+=' — لا نقاط حتى تكمل 3 صحيحة متتالية';else msg+=' +'+earned+' نقطة';state.score=Math.min(1000,state.score+earned);state.xp+=10;state.stage=Math.min(100,1+Math.floor(state.correct/5));toast(msg);beep(720);confetti();checkLegendaryReward()}else{state.streak=0;state.score=Math.max(0,state.score-1);state.xp+=2;toast('❌ خاطئة -1 نقطة');beep(220);vibrate()}if(state.streak>0 && state.streak%10===0)state.roundWins++;if(state.streak>0 && state.streak%25===0)state.perfectRounds++;save();update();setTimeout(nextQuestion,900)}
function timeUp(){if(locked)return;locked=true;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.dataset.ok==='1')b.classList.add('correct')});state.answered++;state.streak=0;state.score=Math.max(0,state.score-1);state.xp+=1;save();update();toast('⏰ انتهى الوقت! -1 نقطة');beep(180);vibrate();setTimeout(nextQuestion,1200)}
function checkLegendaryReward(){const acc=state.answered?state.correct/state.answered:0;if(state.score>=500&&state.streak>=25&&!state.legendary500){state.legendary500=true;state.score=Math.min(1000,state.score+100);toast('💎 مكافأة أسطورية! +100 نقطة');confetti();beep(1000)}if(state.score>=900&&state.streak>=50&&acc>=.95&&!state.legendary1000){state.legendary1000=true;state.score=1000;toast('👑🔥 وصلت إلى 1000 نقطة!');confetti();beep(1200);vibrate()}}
function clearAnswer(){if(locked)return;selected=null;document.querySelectorAll('.answer').forEach(b=>b.classList.remove('selected'))}
function skipQuestion(){if(locked||state.skips<=0){toast('⏭️ لا يوجد تخطي متاح');return}state.skips--;save();nextQuestion();toast('⏭️ تم التخطي بدون نقاط')}
function help(){if(locked||state.helps<=0){toast('💡 انتهت المساعدات');return}state.helps--;let w=[...document.querySelectorAll('.answer')].filter(b=>b.dataset.ok!=='1'&&!b.disabled);shuffle(w).slice(0,2).forEach(b=>{b.disabled=true;b.classList.add('eliminated')});save();update();toast('💡 حُذفت إجابتان خاطئتان')}
function revealAnswer(){if(locked||state.reveals<=0){toast('👁️ انتهت بطاقات الكشف');return}state.reveals--;document.querySelectorAll('.answer').forEach(b=>{if(b.dataset.ok==='1')b.classList.add('correct')});save();update();toast('👁️ تم كشف الإجابة بدون نقاط')}
function update(){$('score').textContent=state.score>=1000?'1000 👑':state.score;$('xp').textContent=state.xp;$('stage').textContent=state.stage;$('correct').textContent=state.correct;$('streak').textContent=state.streak;$('best').textContent=state.best;$('accuracy').textContent=(state.answered?Math.round(state.correct/state.answered*100):0)+'%';$('skipCount').textContent=state.skips;$('helpCount').textContent=state.helps;$('revealCount').textContent=state.reveals;$('soundLabel').textContent=state.sound?'الصوت':'✖ الصوت';$('vibLabel').textContent=state.vibration?'اهتزاز':'✖ اهتزاز';$('qnum').textContent='السؤال '+state.used.length+' / '+pool().length;$('bar').style.width=state.stage+'%';$('modeLabel').textContent=modeInfo().name;$('difficultyLabel').textContent=state.mode==='classic'?'عادي':state.mode==='speed'?'سريع':state.mode==='hard'?'صعب':'بقاء'}
function beep(f){if(!state.sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=window._ac||(window._ac=new A());if(c.state==='suspended')c.resume();const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>o.stop(),120)}catch(e){}}
function vibrate(){if(state.vibration&&navigator.vibrate)navigator.vibrate(35)}
function toggleSound(){state.sound=!state.sound;save();update();toast(state.sound?'🔊 الصوت يعمل':'✖ تم إيقاف الصوت')}
function toggleVibration(){state.vibration=!state.vibration;save();update();toast(state.vibration?'📳 الاهتزاز يعمل':'✖ تم إيقاف الاهتزاز')}
function openModal(h){$('modalContent').innerHTML=h;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}
function openCategories(){let h='<h2>🗺️ اختر الفئة</h2><div class="menuGrid"><button class="menuBtn" onclick="setCat(\'all\')">🌍 كل الفئات</button>';for(const[k,v]of Object.entries(C))h+=`<button class="menuBtn" onclick="setCat('${k}')">${v}</button>`;openModal(h+'</div>')}
function setCat(c){state.category=c;state.used=[];save();closeModal();nextQuestion();toast('تم تغيير الفئة')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function openStats(){let a=state.answered?Math.round(state.correct/state.answered*100):0;openModal(`<h2>📊 الإحصائيات</h2><div class="row"><b>👤 الاسم</b><span>${esc(state.name)}</span></div><div class="row"><b>🏆 النقاط</b><span>${state.score}/1000</span></div><div class="row"><b>⭐ XP</b><span>${state.xp}</span></div><div class="row"><b>👑 المرحلة</b><span>${state.stage}/100</span></div><div class="row"><b>🎯 الدقة</b><span>${a}%</span></div><div class="row"><b>🔥 أفضل سلسلة</b><span>${state.best}</span></div><div class="row"><b>🧠 الأسئلة</b><span>${questions.length}</span></div><div class="row"><b>🎮 الجولة</b><span>${esc(modeInfo().name)}</span></div><div class="row"><b>🏅 سلاسل مكتملة</b><span>${state.roundWins}</span></div>`)}
function openSettings(){openModal(`<h2>⚙️ الإعدادات</h2><div class="row"><b>👤 اسم اللاعب</b><button class="menuBtn" onclick="changeName()">${esc(state.name)}</button></div><div class="row"><b>🔊 الصوت</b><button class="menuBtn" onclick="toggleSound();openSettings()">${state.sound?'تشغيل':'إيقاف'}</button></div><div class="row"><b>📳 الاهتزاز</b><button class="menuBtn" onclick="toggleVibration();openSettings()">${state.vibration?'تشغيل':'إيقاف'}</button></div><div class="row"><b>🎮 الجولة الحالية</b><button class="menuBtn" onclick="openModes()">${esc(modeInfo().name)}</button></div><button class="menuBtn danger" onclick="resetGame()">♻️ إعادة التقدم بالكامل</button>`)}
function changeName(){let n=prompt('اكتب اسم اللاعب',state.name);if(n&&n.trim()){state.name=n.trim().slice(0,30);save();toast('تم حفظ الاسم');openSettings()}}
function showBadges(){const a=[['🌟 البداية',state.correct>=1],['🔥 سلسلة 10',state.best>=10],['💰 100 نقطة',state.score>=100],['💎 500 نقطة',state.score>=500],['👑 1000 نقطة',state.score>=1000]];openModal('<h2>🎁 الإنجازات</h2>'+a.map(x=>`<div class="row"><b>${x[0]}</b><span>${x[1]?'✅':'🔒'}</span></div>`).join(''))}
function showLeaderboard(){let b=[];try{b=JSON.parse(localStorage.getItem('ammarBoard')||'[]')}catch(e){}if(!Array.isArray(b))b=[];b=b.filter(x=>x.name!==state.name);b.push({name:state.name,score:state.score});b.sort((a,z)=>z.score-a.score);b=b.slice(0,20);try{localStorage.setItem('ammarBoard',JSON.stringify(b))}catch(e){}openModal('<h2>🏆 لوحة الصدارة</h2>'+b.map((x,i)=>`<div class="row"><b>${i+1}. ${esc(x.name)}</b><span>${x.score} 🏆</span></div>`).join(''))}
function resetGame(){if(confirm('سيتم حذف التقدم بالكامل. هل أنت متأكد؟')){clearInterval(timerInterval);localStorage.removeItem('ammarLegendV3');location.reload()}}
function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1500);vibrate()}
function confetti(){for(let i=0;i<24;i++){let e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#16d59d','#ffd34e','#5de8ee','#ff7d86'][Math.floor(Math.random()*4)];e.style.animationDelay=Math.random()*.2+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}}
$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInterval(timerInterval);else if(current&&!locked)startTimer()});
try{nextQuestion();update()}catch(e){console.error(e);$('questionText').textContent='⚠️ حدث خطأ غير متوقع';$('answers').innerHTML='<button class="answer" onclick="location.reload()">🔄 إعادة تشغيل</button>'}
</script></body></html>
