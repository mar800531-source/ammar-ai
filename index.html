<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>عمار الأسطورة 👑</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Tahoma,Arial,sans-serif;color:#f4fffc;background:radial-gradient(circle at 50% -10%,#08775e,#06372d 38%,#02120f)}
button{font:inherit;border:0;color:inherit;cursor:pointer}
.app{height:100dvh;max-width:760px;margin:auto;padding:5px 7px;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.top{height:52px;display:grid;grid-template-columns:52px 1fr 52px 52px 52px;gap:5px;align-items:center;flex:none}
.logo{text-align:center;font-size:clamp(19px,5vw,30px);font-weight:900;background:linear-gradient(90deg,#58e9a9,#68edf0);-webkit-background-clip:text;color:transparent;white-space:nowrap}
.scircle{width:50px;height:50px;border-radius:50%;background:#07372f;border:2px solid #1b7662;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px}
.scircle b{color:#ffd84f;font-size:16px}.sound{font-size:21px;background:#07372f}
.progress{height:43px;flex:none;border:1px solid #1c6555;border-radius:25px;background:#062b24;display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;padding:5px 11px;gap:7px;font-size:12px;font-weight:900}
.barbox{height:9px;background:#12483e;border-radius:20px;overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,#5fe2a0,#5be8ef);transition:.25s}
.main{min-height:0;flex:1;border:2px solid #15745e;border-radius:25px;background:#041f1af5;padding:7px;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.cat{height:20px;text-align:center;color:#55e6ac;font-weight:900;font-size:13px}
.question{height:76px;flex:none;border:1px solid #1a6353;border-radius:18px;background:#031b17;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px}
#q{font-size:clamp(17px,4.5vw,25px);font-weight:900;line-height:1.3}
.answers{min-height:0;flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5px}
.answer{min-height:0;border-radius:17px;background:#062c25;border:1.5px solid #176252;font-size:clamp(13px,3.7vw,19px);font-weight:900;padding:3px}
.answer.correct{background:#075b42;border-color:#69ff9a;box-shadow:0 0 16px #4cff8a55}
.answer.wrong{background:#632c35;border-color:#ff777f}
.tools{height:103px;flex:none;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1fr;gap:4px}
.tool{border-radius:50%;background:#062d26;border:1.5px solid #176a58;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px}
.tool small{font-size:9px;font-weight:900;white-space:nowrap}.tool:disabled{opacity:.32}
.stats{height:40px;flex:none;border:1px solid #1b6354;border-radius:22px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;background:#052820}
.stats div{text-align:center;font-size:10px}.stats b{display:block;color:#ffd84f;font-size:15px;line-height:15px}
.toast{position:fixed;z-index:100;left:50%;bottom:8px;transform:translate(-50%,20px);opacity:0;background:#062b24;border:1px solid #3c9c81;border-radius:13px;padding:7px 13px;font-weight:900;font-size:12px;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:10px;z-index:50}
.modal.show{display:flex}.box{width:min(560px,100%);max-height:88dvh;overflow:auto;background:#062820;border:1px solid #2a7c67;border-radius:20px;padding:13px}
.box h2{margin:0 0 9px;color:#61e9e2;font-size:20px}.close{float:left;background:#173e35;border-radius:9px;padding:3px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mb{background:#0a382f;border:1px solid #1c6654;border-radius:12px;padding:9px;font-weight:bold}
.active{border-color:#67efa8!important;background:#0b4c3c!important}.list{display:grid;gap:5px}
.row{display:flex;justify-content:space-between;background:#0a342c;border:1px solid #195a4c;border-radius:11px;padding:8px;font-size:12px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:6px}.badge{padding:9px;border-radius:11px;background:#0a342c;border:1px solid #195a4c;font-size:11px}
.badge b{display:block;color:#ffd84f}.confetti{position:fixed;top:-10px;width:7px;height:12px;z-index:80;animation:fall .8s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(600deg);opacity:0}}
@media(max-height:600px){.top{height:43px;grid-template-columns:44px 1fr 44px 44px 44px}.scircle{width:42px;height:42px}.progress{height:37px}.question{height:62px}.tools{height:82px}.stats{height:34px}}

</head>

<div class="app">
<header class="top">
<div class="scircle">🏆<b id="score">0</b></div>

<div class="barbox"><div id="bar"></div></div>

<div class="cat" id="cat">📚 ثقافة عامة</div>

<div class="answers" id="answers"></div>

<div class="tools">
<button class="tool" id="help" onclick="help()">💡<small>مساعدة <span id="hc">3</span>⭐</small></button>

<button class="tool" onclick="randomQ()">🎲<small>سؤال جديد</small></button>
<button class="tool" id="reveal" onclick="reveal()">👁️<small>كشف <span id="rc">8</span>⭐</small></button>
<button class="tool" onclick="categories()">🗂️<small>الفئات</small></button>
<button class="tool" onclick="stats()">📊<small>إحصائيات</small></button>
<button class="tool" onclick="badges()">🎁<small>مكافآتي</small></button>
<button class="tool" onclick="leaderboard()">🏆<small>الصدارة</small></button>
<button class="tool" onclick="map()">🗺️<small>الخريطة</small></button>
<button class="tool" onclick="settings()">⚙️<small>الإعدادات</small></button>
</div>

<div class="stats">
<div><b id="correct">0</b>✅ صحيح</div>
<div><b id="acc">0%</b>🎯 دقة</div>
<div><b>+2</b>🏆 الصحيح</div>
</div>
</main>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box"><button class="close" onclick="closeM()">✕</button><div id="mc"></div></div></div>

/* قراءة آمنة للحفظ */
function getState(){
  try{
    const raw=localStorage.getItem("AMMAR300");
    if(!raw) return {...DEFAULT_STATE};
    const saved=JSON.parse(raw);
    if(!saved || typeof saved!=="object") return {...DEFAULT_STATE};
    return {...DEFAULT_STATE,...saved};
  }catch(e){
    console.warn("تعذر قراءة الحفظ:",e);
    return {...DEFAULT_STATE};
  }
}

st=getState();

const $=id=>document.getElementById(id);

function save(){
  try{
    localStorage.setItem("AMMAR300",JSON.stringify(st));
  }catch(e){
    console.warn("تعذر حفظ التقدم:",e);
  }
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/*
  هذه أهم دالة:
  تنقل الإجابة الصحيحة عشوائياً بين المربعات الأربعة،
  وتحدّث رقمها cur.ok حتى يبقى التحقق صحيحاً.
*/
function prepareQuestion(q){
  const answers=q.a.map((text,index)=>({
    text:text,
    correct:index===q.ok
  }));

  shuffle(answers);

  return {
    c:q.c,
    q:q.q,
    a:answers.map(x=>x.text),
    ok:answers.findIndex(x=>x.correct)
  };
}

function rebuild(){
  let ids=Q.map((_,i)=>i);

  if(st.cat!=="all"){
    ids=Q
      .map((x,i)=>x.c===st.cat?i:-1)
      .filter(i=>i>=0);
  }

  st.order=shuffle(ids);
  st.pos=0;
  save();
}

function stage(){
  return Math.min(100,Math.floor(st.answered/3)+1);
}

function qi(){
  return (st.answered%3)+1;
}

/* تحميل السؤال محلياً بدون fetch أو API */
function load(){
  clearTimeout(timer);

  if(!Array.isArray(st.order) || !st.order.length){
    rebuild();
  }

  if(st.pos>=st.order.length){
    rebuild();
  }

  const index=st.order[st.pos];
  const original=Q[index];

  if(!original){
    rebuild();
    const retryIndex=st.order[st.pos];
    if(!Q[retryIndex]){
      showLoadError();
      return;
    }
    cur=prepareQuestion(Q[retryIndex]);
  }else{
    cur=prepareQuestion(original);
  }

  locked=false;
  render();
}

function showLoadError(){
  locked=true;
  $("q").textContent="تعذر تحميل السؤال";
  $("cat").textContent="⚠️ خطأ";
  $("answers").innerHTML=`
    <button class="answer" style="grid-column:1/3" onclick="location.reload()">
      🔄 اضغط لإعادة المحاولة
    </button>`;
}

function render(){
  if(!cur || !Array.isArray(cur.a) || cur.a.length!==4){
    showLoadError();
    return;
  }

  $("q").textContent=cur.q;
  $("cat").textContent=
    N[cur.c]+" • "+
    (stage()<=25?"مبتدئ":stage()<=50?"متوسط":stage()<=75?"متقدم":"خبير");

  $("answers").innerHTML="";

  cur.a.forEach((x,i)=>{
    const b=document.createElement("button");
    b.className="answer";
    b.textContent=x;
    b.onclick=()=>answer(i,b);
    $("answers").appendChild(b);
  });

  ui();
}

function answer(i,b){
  if(locked)return;

  locked=true;

  document.querySelectorAll(".answer").forEach(x=>x.disabled=true);

  st.answered++;

  if(i===cur.ok){
    b.classList.add("correct");
    st.correct++;
    st.score+=2;
    st.xp+=10;
    st.streak++;
    st.best=Math.max(st.best,st.streak);

    toast("✅ صحيح +2");
    beep(750,70);
    setTimeout(()=>beep(950,90),70);
    vib(30);
    fx();
    ach();
  }else{
    b.classList.add("wrong");

    const buttons=document.querySelectorAll(".answer");
    if(buttons[cur.ok]){
      buttons[cur.ok].classList.add("correct");
    }

    st.streak=0;
    st.xp+=2;

    toast("❌ خطأ");
    beep(180,170);
    vib(70);
  }

  save();
  ui();

  timer=setTimeout(()=>{
    st.pos++;
    load();
  },650);
}

function skip(){
  if(locked)return;
  if(st.skip<1)return toast("⏭️ لا يوجد تخطي");

  st.skip--;
  st.pos++;
  save();
  load();
  toast("⏭️ تم التخطي");
}

function help(){
  if(locked)return;
  if(st.help<1)return toast("💡 انتهت المساعدة");

  st.help--;

  const arr=[...document.querySelectorAll(".answer")]
    .map((b,i)=>({b,i}))
    .filter(x=>x.i!==cur.ok);

  shuffle(arr).slice(0,2).forEach(x=>x.b.disabled=true);

  save();
  ui();
  toast("💡 حذفت إجابتين");
}

function reveal(){
  if(locked)return;
  if(st.reveal<1)return toast("👁️ انتهى الكشف");

  st.reveal--;

  const buttons=document.querySelectorAll(".answer");
  if(buttons[cur.ok])buttons[cur.ok].classList.add("correct");

  save();
  ui();
  toast("👁️ تم كشف الصحيح");
}

function ach(){
  const a=[
    ["1","🌟 البداية",st.correct>=1],
    ["10","🔥 عشرة",st.correct>=10],
    ["5s","⚡ سلسلة",st.best>=5],
    ["100p","🏆 جامع النقاط",st.score>=100],
    ["10st","👑 بطل",stage()>=10],
    ["50st","💎 أسطورة",stage()>=50],
    ["100st","🌟 ملك الأسئلة",stage()>=100]
  ];

  a.forEach(x=>{
    if(x[2]&&!st.ach.includes(x[0])){
      st.ach.push(x[0]);
      st.xp+=25;
      toast("🏅 "+x[1]);
    }
  });

  save();
}

    b=JSON.parse(localStorage.getItem("AMMARBOARD")||"[]");
    if(!Array.isArray(b))b=[];
  }catch(e){
    b=[];
  }

  b=b.filter(x=>x.name!==st.name);
  b.push({name:st.name,score:st.score,stage:stage()});
  b.sort((a,b)=>b.score-a.score);
  b=b.slice(0,20);

  try{
    localStorage.setItem("AMMARBOARD",JSON.stringify(b));
  }catch(e){}

  open(`
    <h2>🏆 لوحة الصدارة</h2>
    <button class="mb" style="width:100%;margin-bottom:7px" onclick="nameChange()">
      ✏️ تغيير الاسم
    </button>
    <div class="list">
      ${b.map((x,i)=>`
        <div class="row">
          <b>${i+1}. ${x.name}</b>
          <span>${x.score} 🏆 • ${x.stage}/100</span>
        </div>
      `).join("")}
    </div>
    <p style="font-size:11px;color:#9bc">الصدارة محلية على هذا الجهاز.</p>
  `);
}

function nameChange(){
  const n=prompt("اسم اللاعب:",st.name);
  if(n&&n.trim()){
    st.name=n.trim();
    save();
    leaderboard();
  }
}

function map(){
  const s=stage();

  open(`
    <h2>🗺️ خريطة 100 مرحلة</h2>
    <div class="grid">
      ${Array.from({length:100},(_,i)=>`
        <button class="mb ${i+1===s?"active":""}">
          ${i+1<s?"✅":i+1===s?"👑":"🔒"} المرحلة ${i+1}
        </button>
      `).join("")}
    </div>
  `);
}

function settings(){
  open(`
    <h2>⚙️ الإعدادات</h2>
    <div class="list">
      <button class="mb" onclick="toggleSound();settings()">
        ${st.sound?"🔊 الصوت: مفتوح":"❌ الصوت: مغلق"}
      </button>

      <button class="mb" onclick="st.vib=!st.vib;save();settings()">
        📳 الاهتزاز: ${st.vib?"مفتوح":"مغلق"}
      </button>

      <button class="mb" onclick="st.fx=!st.fx;save();settings()">
        ✨ المؤثرات: ${st.fx?"مفتوحة":"مغلقة"}
      </button>

      <button class="mb" onclick="resetGame()">
        🗑️ إعادة ضبط
      </button>
    </div>

    <p style="font-size:11px;color:#9bc">
      جميع الأسئلة محلية داخل HTML. لا يوجد fetch أو API أو ملف خارجي،
      لذلك لا تعتمد اللعبة على الإنترنت لعرض الأسئلة.
    </p>
  `);
}

function resetGame(){
  if(confirm("حذف التقدم؟")){
    try{
      localStorage.removeItem("AMMAR300");
    }catch(e){}
    location.reload();
  }
}

function toggleSound(){
  st.sound=!st.sound;
  save();
  ui();
  toast(st.sound?"🔊 الصوت يعمل":"❌ الصوت متوقف");
}

function beep(f,d){
  if(!st.sound)return;

  try{
    const c=window.ac||(window.ac=new AudioContext());

    if(c.state==="suspended")c.resume();

    const o=c.createOscillator();
    const g=c.createGain();

    o.connect(g);
    g.connect(c.destination);

    o.frequency.value=f;
    g.gain.value=.04;

    o.start();
    o.stop(c.currentTime+d/1000);
  }catch(e){}
}

function vib(x){
  if(st.vib&&navigator.vibrate)navigator.vibrate(x);
}

function fx(){
  if(!st.fx)return;

  for(let i=0;i<16;i++){
    const e=document.createElement("i");
    e.className="confetti";
    e.style.left=Math.random()*100+"vw";
    e.style.background=
      ["#6cff9b","#ffd84f","#5be8ef","#ff7780"][i%4];

    document.body.appendChild(e);
    setTimeout(()=>e.remove(),850);
  }
}

function toast(x){
  $("toast").textContent=x;
  $("toast").classList.add("show");

  clearTimeout(tt);

  tt=setTimeout(()=>{
    $("toast").classList.remove("show");
  },1200);
}

function open(x){
  $("mc").innerHTML=x;
  $("modal").classList.add("show");
}

function closeM(){
  $("modal").classList.remove("show");
}

$("modal").onclick=e=>{
  if(e.target===$("modal"))closeM();
};

function ui(){
  $("score").textContent=st.score;
  $("xp").textContent=st.xp;
  $("streak").textContent=st.streak;
  $("correct").textContent=st.correct;

  $("stage").textContent=`المرحلة ${stage()}/100`;
  $("qn").textContent=`السؤال ${qi()}/3`;

  $("bar").style.width=((st.answered%3)/3*100)+"%";

  $("hc").textContent=st.help;
  $("sc").textContent=st.skip;
  $("rc").textContent=st.reveal;

  $("acc").textContent=
    (st.answered?
      Math.round(st.correct/st.answered*100):0)+"%";

  $("sound").textContent=st.sound?"🔊":"❌";

  $("help").disabled=st.help<1;
  $("skip").disabled=st.skip<1;
  $("reveal").disabled=st.reveal<1;
}

/* تشغيل آمن عند فتح الملف */
function startGame(){
  try{
    if(!Array.isArray(st.order) || !st.order.length){
      rebuild();
    }

    load();

    if(cur){
      ui();
    }
  }catch(e){
    console.error("GAME START ERROR:",e);
    showLoadError();
  }
}

startGame();
</script>
</body>
</html>
