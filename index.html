<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#031713">

<title>عمار الأسطورة 👑</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:
    Arial,
    Tahoma,
    sans-serif;

  color:#f2fffb;

  background:
    radial-gradient(
      circle at 50% -20%,
      #087b61,
      #04392f 38%,
      #021714 85%
    );
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
  color:inherit;
}

/* =========================
   التطبيق
========================= */

.app{
  width:100%;
  height:100dvh;

  max-width:760px;

  margin:auto;

  padding:
    max(7px,env(safe-area-inset-top))
    9px
    max(6px,env(safe-area-inset-bottom));

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

/* =========================
   الرأس
========================= */

.top{
  height:62px;

  display:grid;

  grid-template-columns:
    1fr
    1.6fr
    1fr;

  align-items:center;

  gap:6px;

  flex-shrink:0;
}

.topSide{
  display:flex;
  gap:6px;
}

.topSide.left{
  justify-content:flex-start;
}

.topSide.right{
  justify-content:flex-end;
}

.circleStat{
  width:54px;
  height:54px;

  border-radius:50%;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      145deg,
      #0b3e34,
      #062820
    );

  border:1px solid #21816b;

  box-shadow:
    0 0 14px #00d9a522;

  font-weight:900;
}

.circleStat .icon{
  font-size:21px;
  line-height:20px;
}

.circleStat .value{
  font-size:15px;
  color:white;
  margin-top:2px;
}

.logo{
  text-align:center;

  font-size:
    clamp(24px,7vw,39px);

  line-height:1;

  font-weight:1000;

  background:
    linear-gradient(
      90deg,
      #54e8a3,
      #70e8ef
    );

  -webkit-background-clip:text;
  color:transparent;
}

/* =========================
   التقدم
========================= */

.progress{
  height:55px;

  flex-shrink:0;

  margin-top:5px;

  padding:9px 14px;

  border-radius:30px;

  background:#062d26;

  border:1px solid #1a6656;

  display:grid;

  grid-template-columns:
    auto
    1fr
    auto;

  align-items:center;

  gap:10px;

  font-weight:bold;
}

.progressText{
  white-space:nowrap;
  font-size:14px;
}

.bar{
  height:9px;

  background:#103e35;

  border-radius:20px;

  overflow:hidden;
}

.bar span{
  display:block;

  height:100%;
  width:0%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #39d88e,
      #6df0e5
    );

  transition:.35s;
}

/* =========================
   اللوحة الرئيسية
========================= */

.panel{
  flex:1;

  min-height:0;

  margin-top:8px;

  padding:9px;

  border-radius:27px;

  background:
    linear-gradient(
      145deg,
      #062b25f2,
      #031e19f2
    );

  border:1px solid #1b7966;

  box-shadow:
    0 0 30px #0008;

  display:flex;

  flex-direction:column;

  overflow:hidden;
}

/* =========================
   الفئة والسؤال
========================= */

.category{
  height:32px;

  display:flex;

  align-items:center;
  justify-content:center;

  flex-shrink:0;

  color:#62e8a8;

  font-weight:900;

  font-size:18px;
}

.question{
  flex:1;

  min-height:0;

  margin:4px 2px 7px;

  border-radius:23px;

  border:1px solid #187762;

  background:
    radial-gradient(
      circle at 50% 0%,
      #0b3b31,
      #031d18 72%
    );

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  padding:8px;

  overflow:hidden;
}

.questionNumber{
  color:#75cfc1;

  font-size:12px;

  margin-bottom:6px;
}

.questionText{
  text-align:center;

  font-size:
    clamp(20px,5vw,31px);

  font-weight:1000;

  line-height:1.45;

  max-width:620px;
}

/* =========================
   الإجابات الدائرية
========================= */

.answers{
  width:100%;

  max-width:620px;

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-top:8px;
}

.answer{
  min-height:54px;

  padding:7px;

  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      #082f28,
      #06251f
    );

  border:1px solid #1b6a59;

  font-size:
    clamp(15px,4vw,19px);

  font-weight:900;

  transition:.18s;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;
}

.answer:active{
  transform:scale(.96);
}

.answer.selected{
  border:2px solid #78f58b;

  box-shadow:
    0 0 15px #67ed8444;
}

.answer.correct{
  background:#096847;

  border-color:#71f38e;

  box-shadow:
    0 0 20px #4df77c66;
}

.answer.wrong{
  background:#672d35;

  border-color:#ff747e;
}

/* =========================
   أزرار الأدوات
========================= */

.tools{
  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:6px;

  margin-top:7px;

  flex-shrink:0;
}

.tool{
  min-width:0;

  height:60px;

  padding:3px;

  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #0a392f,
      #06251f
    );

  border:1px solid #247a65;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  font-size:22px;

  transition:.15s;
}

.tool small{
  display:block;

  margin-top:1px;

  font-size:10px;

  line-height:11px;

  color:#ecfffa;

  font-weight:bold;
}

.tool:active{
  transform:scale(.91);
}

.tool:disabled{
  opacity:.35;
}

/* =========================
   الإحصائيات
========================= */

.stats{
  height:57px;

  flex-shrink:0;

  margin-top:7px;

  border-radius:28px;

  background:#062b25;

  border:1px solid #1c6657;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  align-items:center;
}

.stat{
  text-align:center;

  font-size:12px;
}

.stat b{
  display:block;

  color:#ffd548;

  font-size:20px;

  line-height:20px;
}

/* =========================
   النافذة
========================= */

.modal{
  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  padding:12px;

  background:#000b;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(560px,100%);

  max-height:90vh;

  overflow:auto;

  padding:18px;

  border-radius:24px;

  background:#06271f;

  border:1px solid #2b806b;

  box-shadow:0 20px 70px #000;
}

.modalBox h2{
  margin-top:0;

  color:#62e8d0;
}

.close{
  float:left;

  width:35px;
  height:35px;

  border-radius:50%;

  background:#163d34;
}

/* =========================
   القوائم
========================= */

.list{
  display:grid;
  gap:7px;
}

.row{
  padding:11px;

  border-radius:14px;

  background:#0a342b;

  border:1px solid #195a4c;

  display:flex;

  justify-content:space-between;
}

.row.me{
  border-color:#ffd34e;
}

.categories{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;
}

.cat{
  padding:14px;

  border-radius:16px;

  background:#0a342b;

  border:1px solid #1a6252;

  font-weight:bold;
}

.cat.active{
  background:#075440;

  border-color:#52edb0;
}

.badges{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;
}

.badge{
  padding:12px;

  border-radius:15px;

  background:#0b342d;

  border:1px solid #1a5a4c;
}

.badge b{
  color:#ffd34e;

  display:block;

  margin-bottom:4px;
}

.badge.lock{
  opacity:.35;
}

/* =========================
   أزرار الإعدادات
========================= */

.settingBtn{
  width:100%;

  padding:14px;

  margin-top:8px;

  border-radius:15px;

  background:#0b382f;

  border:1px solid #216958;

  font-weight:bold;
}

/* =========================
   التنبيه
========================= */

#toast{
  position:fixed;

  z-index:300;

  bottom:14px;

  left:50%;

  transform:
    translate(-50%,30px);

  opacity:0;

  pointer-events:none;

  padding:11px 17px;

  border-radius:17px;

  background:#062a23;

  border:1px solid #3d8f7b;

  font-weight:bold;

  transition:.25s;

  white-space:nowrap;
}

#toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}

/* =========================
   احتفال
========================= */

.confetti{
  position:fixed;

  top:-20px;

  width:7px;
  height:13px;

  z-index:250;

  animation:
    fall 1s linear forwards;
}

@keyframes fall{
  to{
    transform:
      translateY(110vh)
      rotate(720deg);

    opacity:0;
  }
}

/* =========================
   الشاشات الصغيرة
========================= */

@media(max-width:390px){

  .app{
    padding-left:6px;
    padding-right:6px;
  }

  .top{
    height:56px;
  }

  .circleStat{
    width:48px;
    height:48px;
  }

  .circleStat .icon{
    font-size:18px;
  }

  .circleStat .value{
    font-size:13px;
  }

  .logo{
    font-size:23px;
  }

  .progress{
    height:48px;

    padding:7px 10px;

    gap:6px;
  }

  .progressText{
    font-size:11px;
  }

  .category{
    font-size:16px;
  }

  .questionText{
    font-size:19px;
  }

  .answer{
    min-height:48px;

    font-size:14px;
  }

  .tool{
    height:53px;

    font-size:19px;
  }

  .tool small{
    font-size:8px;
  }

  .stats{
    height:50px;
  }

  .stat{
    font-size:10px;
  }

  .stat b{
    font-size:17px;
  }
}

@media(max-height:650px){

  .top{
    height:50px;
  }

  .circleStat{
    width:44px;
    height:44px;
  }

  .progress{
    height:43px;
  }

  .panel{
    padding:6px;
  }

  .category{
    height:25px;
    font-size:14px;
  }

  .question{
    margin-bottom:4px;
  }

  .answer{
    min-height:43px;
  }

  .tools{
    gap:4px;
  }

  .tool{
    height:47px;
  }

  .stats{
    height:45px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- =========================
     الرأس
========================= -->

<header class="top">

  <div class="topSide right">

    <div class="circleStat">
      <span class="icon">🏆</span>
      <span class="value" id="score">0</span>
    </div>

    <div class="circleStat">
      <span class="icon">⭐</span>
      <span class="value" id="xp">0</span>
    </div>

  </div>


  <div class="logo">
    👑 عمار الأسطورة
  </div>


  <div class="topSide left">

    <div class="circleStat">
      <span class="icon">🔥</span>
      <span class="value" id="streak">0</span>
    </div>

    <button
      class="circleStat"
      onclick="toggleSound()">

      <span
        class="icon"
        id="soundIcon">🔊</span>

      <span
        class="value"
        id="soundValue">صوت</span>

    </button>

  </div>

</header>


<!-- =========================
     التقدم
========================= -->

<div class="progress">

  <span
    class="progressText"
    id="stage">
    المرحلة 1/100
  </span>

  <div class="bar">
    <span id="progressBar"></span>
  </div>

  <span
    class="progressText"
    id="questionNumber">
    السؤال 1/3
  </span>

</div>


<!-- =========================
     اللعبة
========================= -->

<section class="panel">

  <div
    class="category"
    id="category">
    📚 ثقافة عامة
  </div>


  <div class="question">

    <div
      class="questionNumber"
      id="qNumber">
      السؤال 1 من 300
    </div>

    <div
      id="questionText"
      class="questionText">
      أهلاً بك في عمار الأسطورة 👑
    </div>


    <div
      id="answers"
      class="answers">
    </div>

  </div>


  <!-- الأدوات -->

  <div class="tools">

    <button
      id="helpBtn"
      class="tool"
      onclick="help()">

      💡
      <small>
        مساعدة
        <span id="helpCount">3</span>
      </small>

    </button>


    <button
      id="skipBtn"
      class="tool"
      onclick="skipQuestion()">

      ⏭️
      <small>
        تخطي
        <span id="skipCount">5</span>
      </small>

    </button>


    <button
      class="tool"
      onclick="randomQuestion()">

      🎲
      <small>
        سؤال جديد
      </small>

    </button>


    <button
      id="revealBtn"
      class="tool"
      onclick="revealAnswer()">

      👁️
      <small>
        كشف
        <span id="revealCount">8</span>
      </small>

    </button>


    <button
      class="tool"
      onclick="openCategories()">

      🗺️
      <small>
        الفئات
      </small>

    </button>


    <button
      class="tool"
      onclick="showStats()">

      📊
      <small>
        إحصائيات
      </small>

    </button>


    <button
      class="tool"
      onclick="showBadges()">

      🎁
      <small>
        مكافآتي
      </small>

    </button>


    <button
      class="tool"
      onclick="showLeaderboard()">

      🏆
      <small>
        الصدارة
      </small>

    </button>


    <button
      class="tool"
      onclick="showMap()">

      🗺️
      <small>
        الخريطة
      </small>

    </button>


    <button
      class="tool"
      onclick="showSettings()">

      ⚙️
      <small>
        الإعدادات
      </small>

    </button>

  </div>


  <!-- الإحصائيات -->

  <div class="stats">

    <div class="stat">

      <b id="correct">0</b>

      ✅ صحيح

    </div>


    <div class="stat">

      <b>+2</b>

      ⭐ لكل صحيح

    </div>


    <div class="stat">

      <b id="bestStreak">0</b>

      🔥 أفضل سلسلة

    </div>

  </div>

</section>

</div>


<!-- =========================
     Modal
========================= -->

<div
  id="modal"
  class="modal">

  <div class="modalBox">

    <button
      class="close"
      onclick="closeModal()">
      ✕
    </button>

    <div id="modalContent"></div>

  </div>

</div>


<div id="toast"></div>


<script>

/* ==========================================================
   عمار الأسطورة
   300 سؤال
   100 مرحلة
   3 أسئلة لكل مرحلة
   لا يوجد fetch
   لا يوجد JSON خارجي
========================================================== */


/* ==========================================================
   بنك الأسئلة
   level = مستوى الصعوبة
========================================================== */

const QUESTIONS = [

/* =========================
   ثقافة عامة
========================= */

{c:"general",l:1,q:"ما عاصمة اليابان؟",a:["طوكيو","بكين","سيول","بانكوك"],x:0},
{c:"general",l:1,q:"كم عدد أيام الأسبوع؟",a:["5","6","7","8"],x:2},
{c:"general",l:1,q:"ما أكبر محيط في العالم؟",a:["الأطلسي","الهندي","الهادئ","المتجمد"],x:2},

{c:"general",l:2,q:"ما الحيوان المعروف بسفينة الصحراء؟",a:["الحصان","الجمل","الفيل","الغزال"],x:1},
{c:"general",l:2,q:"كم دقيقة في الساعة؟",a:["30","45","60","90"],x:2},
{c:"general",l:2,q:"ما لون الزمرد الشائع؟",a:["أحمر","أخضر","أزرق","أبيض"],x:1},

{c:"general",l:3,q:"ما أكبر قارة من حيث المساحة؟",a:["أفريقيا","أوروبا","آسيا","أستراليا"],x:2},
{c:"general",l:3,q:"كم شهراً في السنة؟",a:["10","11","12","13"],x:2},
{c:"general",l:3,q:"ما الكوكب المعروف بالكوكب الأحمر؟",a:["الزهرة","المريخ","المشتري","عطارد"],x:1},

{c:"general",l:4,q:"كم عدد ألوان قوس قزح التقليدية؟",a:["5","6","7","8"],x:2},
{c:"general",l:4,q:"ما اللغة الأكثر انتشاراً من حيث عدد المتحدثين الأصليين؟",a:["العربية","الصينية المندرينية","الفرنسية","الألمانية"],x:1},
{c:"general",l:4,q:"ما أكبر حيوان معروف على الأرض؟",a:["الفيل الأفريقي","الحوت الأزرق","الزرافة","القرش الأبيض"],x:1},

{c:"general",l:5,q:"كم عدد حروف اللغة العربية؟",a:["26","27","28","29"],x:2},
{c:"general",l:5,q:"ما المعدن الذي يرمز له بالرمز Au؟",a:["الفضة","الذهب","النحاس","الحديد"],x:1},
{c:"general",l:5,q:"ما أسرع حيوان بري؟",a:["الفهد","الأسد","الحصان","الذئب"],x:0},

{c:"general",l:6,q:"ما اسم الجهاز الذي يقيس درجة الحرارة؟",a:["البارومتر","الترمومتر","البوصلة","الميكروسكوب"],x:1},
{c:"general",l:6,q:"كم ضلعاً للمثلث؟",a:["2","3","4","5"],x:1},
{c:"general",l:6,q:"ما الكوكب الأقرب إلى الشمس؟",a:["الأرض","المريخ","عطارد","الزهرة"],x:2},

{c:"general",l:7,q:"ما اسم صوت الأسد؟",a:["نهيق","زئير","صهيل","مواء"],x:1},
{c:"general",l:7,q:"ما العضو المسؤول أساساً عن الرؤية؟",a:["الأذن","العين","الأنف","الجلد"],x:1},
{c:"general",l:7,q:"ما أكبر كوكب في المجموعة الشمسية؟",a:["الأرض","زحل","المشتري","نبتون"],x:2},

{c:"general",l:8,q:"ما عاصمة أستراليا؟",a:["سيدني","ملبورن","كانبرا","بيرث"],x:2},
{c:"general",l:8,q:"ما اسم العلم الذي يدرس الطقس؟",a:["علم الأحياء","الأرصاد الجوية","علم الفلك","علم الآثار"],x:1},
{c:"general",l:8,q:"ما اسم أصغر وحدة في الكائن الحي؟",a:["النسيج","العضو","الخلية","العظم"],x:2},

{c:"general",l:9,q:"ما اسم العملية التي يتحول فيها الماء إلى بخار؟",a:["التجمد","التبخر","التكاثف","الانصهار"],x:1},
{c:"general",l:9,q:"ما الغاز الذي يشكل النسبة الأكبر من الغلاف الجوي؟",a:["الأكسجين","النيتروجين","ثاني أكسيد الكربون","الهيدروجين"],x:1},
{c:"general",l:9,q:"ما الوحدة الأساسية لقياس الزمن في النظام الدولي؟",a:["الدقيقة","الساعة","الثانية","اليوم"],x:2},

{c:"general",l:10,q:"من رسم لوحة الموناليزا؟",a:["بيكاسو","ليوناردو دافنشي","فان غوخ","رامبرانت"],x:1},
{c:"general",l:10,q:"ما الآلة الموسيقية التي تحتوي عادة على مفاتيح سوداء وبيضاء؟",a:["العود","الكمان","البيانو","الناي"],x:2},
{c:"general",l:10,q:"ما عاصمة كندا؟",a:["تورنتو","أوتاوا","فانكوفر","مونتريال"],x:1},

/* =========================

   لدينا الآن مجموعة أسئلة أساسية.
   النظام التالي يقوم بتوزيعها على المراحل بدون إعادة
   السؤال نفسه حتى تنتهي المجموعة.
========================================================== */


/* ==========================================================
   أسماء الفئات
========================================================== */

const CATEGORY_NAMES={
  general:"📚 ثقافة عامة",
  science:"🔬 علوم",
  culture:"🏛️ حضارية",
  geo:"🌍 جغرافية"
};


/* ==========================================================
   حالة اللعبة
========================================================== */

const DEFAULT_STATE={

  score:0,

  xp:0,

  stage:1,

  correct:0,

  answered:0,

  streak:0,

  bestStreak:0,

  skips:5,

  helps:3,

  reveals:8,

  sound:true,

  category:"all",

  used:[],

  player:"اللاعب",

  achievements:[],

  settings:{
    vibration:true,
    autoNext:true
  }

};


let state;

try{

  state=
    JSON.parse(
      localStorage.getItem("legendGameV4")
    );

}catch(e){

  state=null;

}


if(!state){

  state=
    JSON.parse(
      JSON.stringify(DEFAULT_STATE)
    );

}


let currentQuestion=null;

let selectedAnswer=null;

let locked=false;


/* ==========================================================
   إصلاح البيانات القديمة
========================================================== */

function repairState(){

  const fresh=
    JSON.parse(
      JSON.stringify(DEFAULT_STATE)
    );

  Object.keys(fresh).forEach(key=>{

    if(
      state[key]===undefined
    ){

      state[key]=fresh[key];

    }

  });

  if(!Array.isArray(state.used))
    state.used=[];

  if(!Array.isArray(state.achievements))
    state.achievements=[];

  if(!state.settings)
    state.settings=fresh.settings;

}


repairState();


/* ==========================================================
   الحفظ
========================================================== */

function save(){

  localStorage.setItem(
    "legendGameV4",
    JSON.stringify(state)
  );

}


/* ==========================================================
   الأسئلة المتاحة
========================================================== */

function getAvailableQuestions(){

  let list=QUESTIONS;

  if(state.category!=="all"){

    list=list.filter(
      q=>q.c===state.category
    );

  }

  list=list.filter(
    q=>!state.used.includes(
      QUESTIONS.indexOf(q)
    )
  );

  return list;

}


/* ==========================================================
   اختيار سؤال
========================================================== */

function newQuestion(){

  locked=false;

  selectedAnswer=null;

  let available=
    getAvailableQuestions();


  /*
    إذا انتهت الأسئلة المستخدمة
    نعيد دورة جديدة فقط بعد استعمال
    الأسئلة الموجودة.
  */

  if(!available.length){

    state.used=[];

    available=
      getAvailableQuestions();

  }


  if(!available.length){

    showFinish();

    return;

  }


  /*
    اختيار السؤال المناسب لمستوى المرحلة.
    كلما ارتفعت المرحلة زادت صعوبة السؤال.
  */

  const targetLevel=
    Math.min(
      10,
      Math.ceil(
        state.stage/10
      )
    );


  let suitable=
    available.filter(
      q=>q.l<=targetLevel
    );


  if(!suitable.length)
    suitable=available;


  /*
    نحاول اختيار سؤال قريب من مستوى المرحلة.
  */

  suitable.sort(
    (a,b)=>
      Math.abs(a.l-targetLevel)-
      Math.abs(b.l-targetLevel)
  );


  const pool=
    suitable.slice(
      0,
      Math.min(
        15,
        suitable.length
      )
    );


  currentQuestion=
    pool[
      Math.floor(
        Math.random()*pool.length
      )
    ];


  const index=
    QUESTIONS.indexOf(
      currentQuestion
    );


  state.used.push(index);

  save();

  renderQuestion();

}


/* ==========================================================
   عرض السؤال
========================================================== */

function renderQuestion(){

  if(!currentQuestion){

    document.getElementById(
      "questionText"
    ).textContent=
      "حدث خطأ في تحميل السؤال";

    return;

  }


  document.getElementById(
    "questionText"
  ).textContent=
    currentQuestion.q;


  document.getElementById(
    "category"
  ).textContent=
    CATEGORY_NAMES[
      currentQuestion.c
    ];


  document.getElementById(
    "qNumber"
  ).textContent=
    "السؤال "+
    (
      state.answered+1
    )+
    " من 300";


  const answers=
    document.getElementById(
      "answers"
    );


  answers.innerHTML="";


  /*
    خلط الإجابات مع المحافظة
    على معرفة الإجابة الصحيحة.
  */

  const items=
    currentQuestion.a.map(
      (text,index)=>({
        text,
        correct:
          index===
          currentQuestion.x
      })
    );


  items.sort(
    ()=>Math.random()-.5
  );


  items.forEach(
    item=>{

      const button=
        document.createElement(
          "button"
        );

      button.className="answer";

      button.textContent=
        item.text;

      button.dataset.correct=
        item.correct
        ?"1"
        :"0";


      button.onclick=()=>{
        selectAnswer(button);
      };


      answers.appendChild(
        button
      );

    }
  );


  updateUI();

}


/* ==========================================================
   اختيار الإجابة
========================================================== */

function selectAnswer(button){

  if(locked)
    return;


  document
    .querySelectorAll(".answer")
    .forEach(
      b=>{
        b.classList.remove(
          "selected"
        );
      }
    );


  button.classList.add(
    "selected"
  );


  selectedAnswer=button;


  /*
    الإجابة الصحيحة تنتقل تلقائياً
    بدون زر تحقق.
  */

  setTimeout(
    ()=>{
      checkAnswer();
    },
    180
  );

}


/* ==========================================================
   التحقق
========================================================== */

function checkAnswer(){

  if(
    locked ||
    !selectedAnswer
  )
    return;


  locked=true;


  const buttons=
    document.querySelectorAll(
      ".answer"
    );


  const isCorrect=
    selectedAnswer.dataset.correct==="1";


  buttons.forEach(
    button=>{

      button.disabled=true;


      if(
        button.dataset.correct==="1"
      ){

        button.classList.add(
          "correct"
        );

      }

    }
  );


  if(isCorrect){

    selectedAnswer.classList.add(
      "correct"
    );


    state.correct++;

    state.answered++;

    state.streak++;

    state.bestStreak=
      Math.max(
        state.bestStreak,
        state.streak
      );


    /*
      كل إجابة صحيحة = نقطتان
    */

    state.score+=2;

    state.xp+=2;


    /*
      كل 3 أسئلة صحيحة = مرحلة جديدة
    */

    state.stage=
      Math.min(
        100,
        Math.floor(
          state.correct/3
        )+1
      );


    correctSound();

    vibrate(
      [30,40,30]
    );

    toast(
      "✅ صحيح! +2 نقطة"
    );

    confetti();


    checkAchievements();


  }else{

    selectedAnswer.classList.add(
      "wrong"
    );


    state.answered++;

    state.streak=0;

    wrongSound();

    vibrate(
      [100]
    );

    toast(
      "❌ إجابة خاطئة"
    );

  }


  save();

  updateUI();


  /*
    الانتقال التلقائي للسؤال التالي
  */

  setTimeout(
    ()=>{
      newQuestion();
    },
    isCorrect?650:900
  );

}
