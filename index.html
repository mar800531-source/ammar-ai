<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#031b17">

<title>عمار الأسطورة 👑</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 50% 0%,#064d3d 0%,#03251f 42%,#011411 100%);
    overflow-x:hidden;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
}

.app{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:10px 12px 20px;
}

/* =========================
   الرأس
========================= */

.top{
    display:grid;
    grid-template-columns:1fr 1.5fr 1fr;
    align-items:center;
    gap:7px;
    margin-bottom:10px;
}

.topSide{
    display:flex;
    gap:6px;
    align-items:center;
}

.topSide.left{
    justify-content:flex-start;
}

.topSide.right{
    justify-content:flex-end;
}

.topCircle{
    width:66px;
    height:66px;
    border-radius:50%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle,#07372e,#031d18);

    border:2px solid #237c66;
    box-shadow:
        inset 0 0 15px #00d99b22,
        0 0 15px #00d99b11;

    font-weight:900;
}

.topCircle .icon{
    font-size:23px;
    line-height:23px;
}

.topCircle .num{
    font-size:15px;
    margin-top:3px;
    color:#fff;
}

.soundCircle{
    width:66px;
    height:66px;
    border-radius:50%;
    background:#062e27;
    border:2px solid #237c66;
    color:#fff;
    font-size:26px;
}

.logo{
    text-align:center;
    font-weight:900;
    font-size:clamp(22px,6vw,36px);
    line-height:1.1;

    background:linear-gradient(
        90deg,
        #56e7a5,
        #d8ff72,
        #55e7ed
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

/* =========================
   التقدم
========================= */

.progressBox{
    height:58px;
    border-radius:30px;

    display:grid;
    grid-template-columns:1fr 1.5fr 1fr;
    align-items:center;
    gap:8px;

    padding:8px 14px;

    background:#062a23;
    border:1px solid #286a5b;
}

.progressText{
    font-size:16px;
    font-weight:bold;
    white-space:nowrap;
}

.progressText:last-child{
    text-align:left;
}

.progressCenter{
    position:relative;
}

.progressBar{
    height:14px;
    border-radius:20px;
    overflow:hidden;
    background:#123d35;
    border:1px solid #1d5c4e;
}

.progressFill{
    width:1%;
    height:100%;
    border-radius:20px;

    background:linear-gradient(
        90deg,
        #65e59a,
        #8cff75,
        #55e7ed
    );

    transition:.4s;
}

   بطاقة السؤال
========================= */

    padding:18px 15px 14px;

    border-radius:30px;

    background
